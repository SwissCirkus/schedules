<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schedules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen tool. Top bar; pill palette | board (timeline to block out, calendar to share) | resizable side panel (Details, Assistant). Dark-first to match Kontroll. */
:root{
  /* one light, off-white look (Christian 2026-11-13: "the slight off-white tone … so we're not pure white") */
  --canvas:#f2f0eb;--surface:#f7f6f2;--panel:#efede8;--raise:#e9e7e1;--raise-2:#dfddd6;
  --line:rgba(20,18,14,.08);--line-2:rgba(20,18,14,.15);
  --ink:#141310;--ink-2:#5d5a53;--ink-3:#9a968d;
  --accent:#3d4149;--accent-dim:rgba(61,65,73,.12);--go:#2f6b45;--go-dim:rgba(47,107,69,.12);--danger:#c4472a;--warn:#9a6a12;
  --nonwork:rgba(20,18,14,.045);--hatch:rgba(20,18,14,.09);--bar-ink:#141310;--wkbox:#e6e4de;
  --shadow:0 18px 60px rgba(0,0,0,.16);
  --c0:#e58f8f;--c1:#e8a46c;--c2:#e6c35a;--c3:#bccf6a;--c4:#78c99a;--c5:#5cc6c0;--c6:#5aa9e6;--c7:#8a93e8;--c8:#ad8ce6;--c9:#d98bc9;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rowh:34px;--labw:0px;--side-w:340px;   /* no name column down the left any more: the pills sit there instead (2026-11-13) */
  color-scheme:light;
}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font:13px/1.4 var(--sans);display:flex;flex-direction:column;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-2)}
/* Kontroll's shared scroll bars and sliders (sliders.css): flat square 14 px bars; a 1 px line with a hollow ring */
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:color-mix(in srgb,var(--ink) 6%,transparent)}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 26%,transparent);min-width:24px;min-height:24px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--ink) 38%,transparent)}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-corner{background:transparent}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;min-height:14px;cursor:ew-resize}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:color-mix(in srgb,var(--ink) 55%,transparent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;box-sizing:border-box;width:10px;height:10px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ink) 88%,transparent);background:transparent;margin-top:-4.5px}
input[type=range]:hover::-webkit-slider-thumb{border-color:var(--ink)}
input[type=range]:active::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{border-color:var(--accent)}
input[type=range]::-moz-range-track{height:1px;background:color-mix(in srgb,var(--ink) 55%,transparent)}
input[type=range]::-moz-range-thumb{box-sizing:border-box;width:10px;height:10px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ink) 88%,transparent);background:transparent}

/* top bar */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line-2)}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px;margin-right:4px}
.brand i{width:8px;height:8px;border-radius:2px;background:var(--accent);display:inline-block}
.top .grow{flex:1}
.btn{height:28px;padding:0 10px;border:1px solid var(--line-2);background:var(--raise);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--raise-2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:var(--bar-ink);border-color:transparent;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.drive-ok{color:var(--go)}
.btn.drive-bad{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--raise)}
.btn.danger{color:var(--danger)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{height:26px;padding:0 10px;border:0;background:var(--raise);cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--raise-2);color:var(--ink)}
.in{height:28px;background:var(--panel);border:1px solid var(--line-2);border-radius:5px;padding:0 7px;min-width:0}
.in:hover{border-color:var(--ink-3)}
textarea.in{height:auto;padding:6px 7px;resize:vertical}
.zoom{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12px}
input[type=range]{accent-color:var(--accent);width:90px}
input[type=checkbox]{accent-color:var(--accent)}
.themepick{display:flex;align-items:center;gap:6px}
.ramp{display:inline-flex;height:14px;border-radius:4px;overflow:hidden;width:70px}
.ramp i{flex:1}

/* main */
.main{flex:1;min-height:0;display:flex;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:12px}
.pal{flex:none;width:var(--pal-w);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.pal-tabs{display:flex;border-bottom:1px solid var(--line-2)}
.pal-tabs button{flex:1;height:36px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;font-size:12px;font-weight:500;border-bottom:2px solid transparent}
.pal-tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pal-body{flex:1;min-height:0;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.pal-body .hint{margin:2px 2px 4px}
.pill{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 10px;border-radius:15px;background:var(--c);color:var(--bar-ink);font-weight:500;font-size:12.5px;cursor:grab;user-select:none;touch-action:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.pill span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill small{font-family:var(--mono);font-size:10px;opacity:.65}
.pill.sel{box-shadow:0 0 0 2px var(--ink)}
.pill.rv{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.pill.rv::before{content:"";width:9px;height:9px;transform:rotate(45deg);background:var(--c);border-radius:1px;flex:none}
.pill.out{background:var(--go-dim);color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--go) 45%,transparent)}
.pill.out::before{content:"▶";font-size:9px;color:var(--go)}
.pill.extra{opacity:.85}
.morebtn{display:flex;align-items:center;gap:6px;height:28px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;padding:0 4px;font-size:12px}
.morebtn:hover{color:var(--ink)}
.addpill{height:30px;border:1px dashed var(--line-2);border-radius:15px;background:transparent;color:var(--ink-2);cursor:pointer;font-size:12px}
.addpill:hover{color:var(--ink);border-color:var(--ink-3)}
.dragghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-30%,-50%);opacity:.92;box-shadow:var(--shadow)}
.boardcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.boardwrap{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.board{flex:1;min-width:0;min-height:0;overflow:auto;position:relative;background:var(--surface)}
.board.tlmode::-webkit-scrollbar{height:0}
/* zoom + scroll row: same as Kontroll's Video Edit timeline (sliders.css .vt-zoombar / .vt-hscroll) */
.zbar{flex:none;display:flex;align-items:center;gap:4px;height:18px;padding:0 6px 0 8px;border-top:1px solid var(--line);background:var(--panel)}
.zbar button{display:grid;place-items:center;flex:none;width:16px;height:14px;padding:0;border:0;background:none;color:color-mix(in srgb,var(--ink) 80%,transparent);cursor:pointer;border-radius:2px}
.zbar button:hover{color:var(--ink)}
.zbar input[type=range]{width:64px;margin:0 2px;flex:none}
.hs{flex:1;min-width:40px;height:14px;margin-left:8px;position:relative;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.hs-thumb{position:absolute;top:0;bottom:0;left:0;background:color-mix(in srgb,var(--ink) 26%,transparent)}
.hs-thumb:hover,.hs-thumb.drag{background:color-mix(in srgb,var(--ink) 38%,transparent)}
.hs.full .hs-thumb{opacity:.35}
/* project header: the spreadsheet's title block, as editable boxes */
.projhead{flex:none;display:grid;grid-template-columns:minmax(200px,1.6fr) repeat(2,minmax(130px,1fr)) minmax(150px,.9fr) minmax(110px,.6fr) minmax(260px,2fr);border:1px solid var(--line-2);border-radius:10px;background:var(--surface);overflow:hidden}
.ph{display:flex;flex-direction:column;gap:3px;padding:8px 12px 9px;border-right:1px solid var(--line);min-width:0}
.ph:last-child{border-right:0}
.ph>label,.ph>.phl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.ph input{height:26px;border:1px solid transparent;border-radius:4px;background:transparent;padding:0 5px;margin-left:-6px;min-width:0;width:calc(100% + 6px)}
.ph input:hover{border-color:var(--line-2)}
.ph input:focus{border-color:var(--accent);background:var(--panel);outline:none}
.ph .big{font-size:16px;font-weight:600;letter-spacing:-.01em}
.ph .val{font-size:13.5px;font-weight:500}
.ph input[type=date]{font-family:var(--mono);font-size:12.5px}
.ph .sub{font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .lenrow{display:flex;align-items:center;gap:4px}
.ph .lenrow input{width:52px;margin-left:-6px}
.ph .lenrow span{color:var(--ink-2);font-size:12px}
.ph .lenrow input + span + input{width:40px;margin-left:2px}
.lenpair{display:grid;grid-template-columns:1fr 64px;gap:6px}
.ph.outs{gap:4px}
.outlist{display:flex;flex-direction:column;gap:2px;max-height:78px;overflow:auto}
.oline{display:grid;grid-template-columns:34px 1fr 118px 18px;gap:2px;align-items:center}
.oline input{height:22px;margin-left:0;width:100%;font-size:12.5px}
.oline input.n{text-align:right;font-family:var(--mono);font-size:12px}
.oline input[type=date]{font-size:11.5px}
.oline .x{width:18px;height:18px;font-size:13px;opacity:0}
.oline:hover .x{opacity:1}
.ph .addo{align-self:flex-start;height:20px;border:0;background:transparent;color:var(--ink-2);font-size:12px;cursor:pointer;padding:0}
.ph .addo:hover{color:var(--ink)}
@media (max-width:1300px){.projhead{grid-template-columns:repeat(3,minmax(0,1fr))}.ph{border-bottom:1px solid var(--line)}}
.splitter{flex:none;width:6px;margin:0 -9px;cursor:col-resize;position:relative;z-index:2}
.splitter::after{content:"";position:absolute;left:2px;top:40%;height:20%;width:2px;border-radius:2px;background:var(--line-2)}
.splitter:hover::after{background:var(--accent)}
.side{flex:none;width:var(--side-w);min-width:260px;max-width:55vw;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.side-tabs{display:flex;border-bottom:1px solid var(--line-2)}
.side-tabs button{flex:1;height:36px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;font-weight:500;border-bottom:2px solid transparent}
.side-tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.side-body{flex:1;min-height:0;overflow:auto}
#details{padding:14px;display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:11px;font-family:var(--mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:11px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 70px;gap:8px}
.hint{font-size:12px;color:var(--ink-2);line-height:1.5;margin:0}
.hint b{color:var(--ink);font-weight:500}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:6px;align-items:center}
.li .in{flex:1}
.x{width:24px;height:24px;border:0;background:transparent;color:var(--ink-3);cursor:pointer;border-radius:4px;flex:none;font-size:15px;line-height:1}
.x:hover{color:var(--danger);background:var(--raise)}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none;display:inline-block}
.dia{width:9px;height:9px;transform:rotate(45deg);background:var(--c);border-radius:1px;display:inline-block;flex:none}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches button{width:24px;height:24px;border-radius:6px;border:0;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatches button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;background:var(--raise);font-size:12px;border:0;cursor:pointer;color:var(--ink)}
.tag:hover{background:var(--raise-2)}

/* timeline */
.tl{position:relative;min-width:100%}
.tl-head{position:sticky;top:0;z-index:6;background:var(--surface)}
.hr1{height:26px;position:relative;border-bottom:1px solid var(--line)}
.hr2{height:34px;position:relative;border-bottom:1px solid var(--line-2)}
.wkc{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-2);padding:5px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.wkc b{color:var(--ink);font-weight:500;margin-right:6px}
.dc{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--ink);user-select:none;line-height:1.15}
.dc b{font-size:9px;font-weight:400;color:var(--ink-3)}
.dc.nw{color:var(--ink-3)}
.dc.hol{color:var(--warn)}
.dc.dlv{color:var(--go);font-weight:600}
.dc.today{color:var(--accent);font-weight:600}
.tl-body{position:relative}
.cols{position:absolute;inset:0;pointer-events:none;z-index:0}
.col{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.col.wkstart{border-left-color:var(--line-2)}
.col.nw{background:var(--nonwork)}
.col.hol{background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,transparent 4px 8px)}
.col.dlv{background:var(--go-dim);box-shadow:inset 2px 0 0 color-mix(in srgb,var(--go) 70%,transparent),inset -2px 0 0 color-mix(in srgb,var(--go) 70%,transparent)}
.col.today::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);opacity:.55}
.col.pend{box-shadow:inset -2px 0 0 var(--line-2)}
.lane{position:relative;height:var(--rowh);border-bottom:1px solid var(--line-2);cursor:copy}
.lanelbl{position:sticky;left:8px;top:0;display:inline-flex;align-items:center;height:var(--rowh);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);pointer-events:none;z-index:1}
.trow{position:relative;height:var(--rowh);border-bottom:1px solid var(--line)}
.trow.sel{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.droprow{position:relative;height:56px;display:flex;align-items:center}
.droprow .lanelbl{height:56px;text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:12px;color:var(--ink-3)}
.crew{position:relative;height:var(--rowh);border-top:1px solid var(--line-2)}
svg.links{position:absolute;top:0;left:0;z-index:1;pointer-events:none;overflow:visible}
svg.links path.ln{fill:none;stroke:var(--ink-3);stroke-width:1.4}
svg.links path.hit{fill:none;stroke:transparent;stroke-width:10;pointer-events:stroke;cursor:pointer}
svg.links g:hover path.ln,svg.links g.hot path.ln{stroke:var(--accent);stroke-width:2}
svg.links circle.lh{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.6;pointer-events:all;cursor:grab}
svg.links g:hover circle.lh,svg.links g.hot circle.lh{stroke:var(--accent);fill:var(--accent)}
svg.rubber{position:absolute;top:0;left:0;z-index:7;pointer-events:none;overflow:visible}
svg.rubber path{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
svg.rubber circle{fill:var(--accent)}
/* bars fill their row exactly, square corners */
.bar{position:absolute;top:0;bottom:0;background:var(--c);color:var(--bar-ink);border-radius:0;display:flex;align-items:center;font-size:12px;font-weight:500;cursor:grab;z-index:2;touch-action:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.bar:active{cursor:grabbing}
.bar.sel{box-shadow:inset 0 0 0 2px var(--bar-ink);z-index:3}
.bar.target{box-shadow:inset 0 0 0 3px var(--accent)}
.bar .lbl{padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;cursor:text}
.dbadge{flex:none;height:18px;min-width:26px;padding:0 5px;margin-right:2px;border-radius:2px;border:0;background:rgba(0,0,0,.16);color:var(--bar-ink);font-family:var(--mono);font-size:10.5px;font-weight:500;cursor:text}
.dbadge:hover{background:rgba(0,0,0,.28)}
.cpick{flex:none;width:16px;height:11px;margin-right:4px;padding:0;border:1.5px solid rgba(0,0,0,.45);border-radius:2px;background:var(--c);cursor:pointer}
.cpick:hover{border-color:var(--bar-ink);transform:scale(1.12)}
.cmenu .swatches{display:grid;grid-template-columns:repeat(10,22px);gap:5px}
.cmenu .swatches button{width:22px;height:22px}
.h{width:8px;align-self:stretch;cursor:ew-resize;flex:none}
.h:hover{background:rgba(0,0,0,.2)}
.knob{position:absolute;right:-12px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-2);cursor:crosshair;opacity:0;transition:opacity .12s;z-index:4}
.bar:hover .knob,.bar.sel .knob,body.linking .knob{opacity:1}
.knob:hover{border-color:var(--accent);background:var(--accent)}
.outlbl{position:absolute;top:0;height:var(--rowh);display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap;pointer-events:none;z-index:2}
.inl{height:20px;border:1px solid var(--ink);border-radius:4px;background:var(--surface);color:var(--ink);padding:0 4px;font-size:12px;min-width:0}
.mk{position:absolute;z-index:4;touch-action:none;cursor:grab}
.mk.rv{top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;transform:rotate(45deg);background:var(--c);border-radius:2px;box-shadow:0 0 0 2px var(--surface)}
.mk.rv.sel{box-shadow:0 0 0 2px var(--ink)}
.mk.dl{top:50%;height:22px;margin-top:-11px;padding:0 8px 0 6px;border-radius:3px 11px 11px 3px;background:var(--go);color:var(--bar-ink);font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;cursor:ew-resize}
.mk.dl.sel{box-shadow:0 0 0 2px var(--ink)}
.ghostbar{position:absolute;height:calc(var(--rowh) - 1px);border-radius:0;background:var(--c);opacity:.55;z-index:5;pointer-events:none;border:1px dashed var(--bar-ink)}
.insline{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:5;pointer-events:none}
.colmark{position:absolute;top:0;bottom:0;background:var(--accent-dim);z-index:0;pointer-events:none}
.cc{position:absolute;top:7px;bottom:7px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;border-radius:4px;color:var(--ink-2)}
.cc.l1{background:var(--accent-dim)}
.cc.l2{background:var(--accent-dim);color:var(--ink)}
.cc.over{background:color-mix(in srgb,var(--danger) 30%,transparent);color:var(--ink)}
.empty{position:absolute;left:24px;top:calc(var(--rowh) + 22px);max-width:420px;color:var(--ink-2);font-size:13px;line-height:1.5;pointer-events:none}
.empty b{color:var(--ink)}

/* calendar (the shareable view) */
.cal{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:700px}
.cal-head{display:grid;grid-template-columns:1fr auto;gap:6px 24px;align-items:end;padding-bottom:12px;border-bottom:1px solid var(--line-2)}
.cal-head h2{margin:0;font-size:22px;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
.cal-head .who{color:var(--ink-2)}
.cal-head .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right;line-height:1.6}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.wk{display:grid;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--panel)}
.cbg{border-left:1px solid var(--line);background:var(--surface)}
.cbg.nw{background:var(--nonwork)}
.cbg.hol{background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,var(--surface) 4px 8px)}
.cbg.dlv{background:var(--go-dim);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--go) 60%,transparent)}
.cbg.today{box-shadow:inset 0 3px 0 var(--accent)}
.wl{padding:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-2);background:var(--panel);display:flex;flex-direction:column;gap:2px;z-index:1}
.wl b{color:var(--ink);font-weight:500;font-size:12px}
.dh{padding:7px 8px 2px;font-family:var(--mono);font-size:11px;color:var(--ink-2);z-index:1;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;user-select:none}
.dh b{color:var(--ink);font-weight:500}
.dh .hn{color:var(--warn)}
.dr{padding:2px 6px 6px;z-index:1;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;min-height:30px;cursor:copy}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:10px;font-size:11px;background:var(--raise);color:var(--ink);cursor:grab;white-space:nowrap;touch-action:none}
.chip.dl{background:var(--go);color:var(--bar-ink);font-weight:600}
.chip.sel{box-shadow:0 0 0 2px var(--ink)}
/* calendar bars fill their row and day cells exactly, square corners (same as the timeline) */
.cbar{z-index:2;margin:0;background:var(--c);color:var(--bar-ink);border-radius:0;display:flex;align-items:center;font-size:12px;font-weight:500;cursor:grab;min-width:0;touch-action:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.cbar.sel{box-shadow:inset 0 0 0 2px var(--bar-ink);z-index:3}
.cbar .lbl{padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.cbar .dbadge{pointer-events:none}

/* assistant */
#ai{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:8px 11px;border-radius:10px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--raise-2)}
.msg.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg.a ul{margin:6px 0 0;padding-left:16px;color:var(--ink-2);font-size:12px;white-space:normal}
.msg .acts{margin-top:8px;display:flex;gap:6px}
.msg.sys{align-self:stretch;max-width:none;background:transparent;border:1px dashed var(--line-2);color:var(--ink-2);font-size:12px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.sugg button{height:24px;padding:0 9px;border-radius:12px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font-size:12px;cursor:pointer}
.sugg button:hover{color:var(--ink);border-color:var(--ink-3)}
#aiForm{border-top:1px solid var(--line-2);padding:12px 14px 56px;display:flex;flex-direction:column;gap:8px;background:#e1ded6}   /* darker than the chat above; the bottom 56px stays free for Kontroll's floating chat and help buttons */
#aiForm textarea{background:var(--surface)}
#aiForm textarea{width:100%;min-height:62px}
.aibar{display:flex;align-items:center;gap:8px}   /* room for Kontroll's chat bubble in the bottom-right corner */
.aiic{width:30px;padding:0;justify-content:center;font-weight:700}
.aiic.live{color:#fff;background:var(--danger)}
.aimodel{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.aimodel select{flex:1;min-width:0;height:26px;font-size:12px}
.msg.help{align-self:stretch;max-width:none;background:var(--panel);border:1px solid var(--line-2);font-size:12.5px}
.msg.help b{font-weight:600}
.msg.help ul{margin:6px 0 0;padding-left:18px}
.aibar .st{flex:1;font-size:12px;color:var(--ink-2)}

/* wizard */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(720px,100%);background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:min(560px,calc(100vh - 56px))}
.wz-top{display:flex;align-items:center;gap:12px;padding:16px 22px 0}
.dots{display:flex;gap:6px;flex:1}
.dots button{flex:1;height:4px;border:0;border-radius:2px;background:var(--raise-2);cursor:pointer;padding:0}
.dots button.done{background:color-mix(in srgb,var(--accent) 55%,var(--raise-2))}
.dots button.on{background:var(--accent)}
.wz-step{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-2);white-space:nowrap}
.wz-body{flex:1;padding:22px 22px 10px;display:flex;flex-direction:column;gap:18px}
.wz-body h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.wz-body .lead{margin:-10px 0 0;color:var(--ink-2)}
.optrow{display:flex;align-items:center;gap:10px;margin-top:6px}
.optrow>span{width:110px;font-size:12.5px;color:var(--ink-2)}
.stgrid{display:flex;flex-wrap:wrap;gap:6px}
.stchip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 8px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);cursor:pointer;font-size:12.5px}
.stchip i{width:10px;height:10px;border-radius:2px;background:var(--line-2)}
.stchip small{font-size:10.5px;color:var(--ink-3)}
.stchip.on{color:var(--ink);background:color-mix(in srgb,var(--c) 22%,var(--surface));border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.stchip.on i{background:var(--c)}
.stchip.on small{color:var(--ink-2)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.type{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);cursor:pointer}
.type:hover{border-color:var(--ink-3)}
.type b{font-size:14px;font-weight:600}
.type small{color:var(--ink-2);font-size:12px;line-height:1.4}
.type.on{border-color:var(--accent);background:var(--accent-dim)}
.type.on b::after{content:" ✓";color:var(--accent)}
.preset{padding:10px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);line-height:1.5}
.preset b{color:var(--ink);font-weight:500}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.role{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.role.off{opacity:.55}
.role .rn{flex:1;min-width:0;font-size:12.5px}
.role{flex-wrap:wrap}
.pdurs{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 8px;padding-top:4px}
.pdur{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-2)}
.pdur input{width:52px;height:22px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);padding:0 4px;font:inherit;color:var(--ink);text-align:right}
.pdur .pfull{display:inline-flex;align-items:center;gap:3px;margin-left:4px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.pdur .pfull input{width:auto;height:auto;margin:0}
.pdur input:disabled{opacity:.4}
.pdur input::placeholder{color:var(--ink-3)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.step button{width:24px;height:24px;border:0;background:var(--raise);cursor:pointer}
.step button:hover{background:var(--raise-2)}
.step span{width:26px;text-align:center;font-family:var(--mono);font-size:12px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:40px;height:26px;border:1px solid var(--line-2);border-radius:6px;background:var(--raise);color:var(--ink-2);cursor:pointer;font-size:12px}
.days button.on{background:var(--accent);color:var(--bar-ink);border-color:transparent;font-weight:600}
.outrow{display:grid;grid-template-columns:62px 1fr 150px 24px;gap:6px;align-items:center}
/* the job as a green line under each deliverable; the picked day is orange */
.otlrow{display:flex;align-items:center;gap:10px;margin:2px 30px 8px 68px}
.otl{flex:1;display:flex;height:14px;border-radius:3px;overflow:hidden;background:color-mix(in srgb,var(--go) 22%,var(--surface))}
.otl i{flex:1;min-width:1px;background:color-mix(in srgb,var(--go) 55%,var(--surface));box-shadow:inset -1px 0 0 rgba(255,255,255,.35);cursor:pointer}
.otl i.nw{flex:.45;background:color-mix(in srgb,var(--go) 18%,var(--surface))}
.otl i.mon{box-shadow:inset 1px 0 0 rgba(0,0,0,.25),inset -1px 0 0 rgba(255,255,255,.35)}
.otl i:hover{background:var(--go)}
.otl i.on{background:#e8892b;box-shadow:0 0 0 1px #b8641a inset}
.otl-cap{flex:none;font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap;min-width:170px}
.wsum{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.wz-foot{padding:14px 22px 18px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line)}
.wz-foot .grow{flex:1}
.dlg{width:min(720px,100%);min-height:0}
.dlg header{padding:18px 20px 6px}
.dlg header h2{margin:0;font-size:18px;font-weight:600}
.dlg header p{margin:4px 0 0;color:var(--ink-2)}
.mbody{padding:14px 20px;display:flex;flex-direction:column;gap:12px}
.mfoot{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;align-items:center;border-top:1px solid var(--line)}
.mfoot .grow{flex:1;font-size:12px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise-2);color:var(--ink);padding:8px 14px;border-radius:8px;box-shadow:var(--shadow);z-index:90;font-size:12.5px;max-width:calc(100% - 32px)}

/* ===== the schedule page (2026-11-13, from Christian's two reference layouts) ===== */
.main{padding:0;gap:0}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column}
.main .splitter{margin:0 -3px}
.main .side{border-radius:0;border-width:0 0 0 1px}
body.side-off .side,body.side-off .splitter{display:none}
#sideBtn.on{background:var(--raise-2)}
/* Details: the crew overview */
.crewtab{width:100%;border-collapse:collapse;font-size:12.5px}
.crewtab th{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:4px 4px 6px;border-bottom:1px solid var(--line-2)}
.crewtab td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.crewtab td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.crewtab tr.crewh td{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding-top:10px;border-bottom:1px solid var(--line-2)}
.crewtab tfoot td{font-weight:700;border-bottom:0;border-top:1px solid var(--line-2)}
.doc{flex:1;min-height:0;overflow:auto;padding:22px max(24px,env(safe-area-inset-right,0px)) 18px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.boardcol{flex:none;gap:18px}
.boardwrap{flex:none;background:var(--surface);border:0;border-radius:0;overflow:visible}
.board{overflow-x:auto;overflow-y:hidden;background:var(--surface)}
/* title block: heavy project name, the client light and wide underneath; Start | Duration on the right */
.projhead{display:flex;align-items:flex-end;gap:28px;border:0;border-radius:0;background:transparent;overflow:visible;grid-template-columns:none}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.ttl input{border:1px solid transparent;background:transparent;padding:0;margin:0;min-width:0;width:100%;border-radius:3px;color:var(--ink)}
.ttl input:hover{border-color:var(--line-2)}
.ttl input:focus{outline:none;border-color:var(--ink-3);background:var(--panel)}
.ttl .pname{font-weight:900;font-size:clamp(34px,5.2vw,74px);line-height:.95;letter-spacing:-.025em;text-transform:uppercase}
.ttl .pclient{font-weight:300;font-size:clamp(18px,2.2vw,30px);letter-spacing:.32em;text-transform:uppercase;margin-top:6px}
.facts{flex:none;display:flex;align-items:stretch}
.fact{padding:0 26px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px;min-width:170px}
.fact:first-child{border-left:0}
.fact .fl{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--ink-2);text-transform:uppercase}
.fact .fv{font-family:var(--mono);font-size:19px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.fact .fv input{width:2.6em;font:inherit;letter-spacing:inherit;border:1px solid transparent;border-radius:3px;background:transparent;padding:0 2px;text-align:right}
.fact .fv input:hover{border-color:var(--line-2)}
.fact .fv input:focus{outline:none;border-color:var(--ink-3);background:var(--panel)}
.fact .fs{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.fact .pickdate{cursor:pointer;border-radius:3px}
.fact .pickdate:hover{background:var(--raise)}
.hidden-date{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* deliverables: a grey box; three per column, a second column beside it, then the columns grow longer */
.deliv{display:flex;gap:40px;align-items:flex-start;background:#e1ded6;padding:20px 22px 16px}
.fact .fv.sm{font-size:13px;color:var(--ink-2);letter-spacing:.08em}
/* the pills on the left: a category menu, the Custom block always on top, then that category's pills */
.main .pal{width:214px;border-radius:0;border-width:0 1px 0 0;background:var(--panel)}
.pal-top{padding:10px 10px 0}
.pal-top select{width:100%;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.main .pal-body{padding:10px}
.pill.custom{font-weight:600}
.pill.custom::before{content:"+";font-weight:700;color:var(--bar-ink)}
/* the colour theme box above the pills; click the colours to make your own */
.pal-top{display:flex;flex-direction:column;gap:8px}
.pal-top .themepick{display:flex;gap:6px;align-items:center}
.pal-top .ramp{flex:none;width:64px;height:26px;padding:0;border:1px solid var(--line-2);border-radius:4px;cursor:pointer;overflow:hidden;display:flex;background:none}
.pal-top .ramp:hover{border-color:var(--ink-2)}
.pal-top .themepick select{flex:1;min-width:0}
.owned{width:300px;padding:6px 8px 10px}
.ownrow{display:flex;gap:8px;align-items:center;padding:4px 2px}
.ownc{position:relative;display:inline-flex}
.ownc input{width:44px;height:32px;padding:0;border:1px solid var(--line-2);border-radius:4px;background:none;cursor:pointer}
.ownc .x{position:absolute;top:-8px;right:-8px;width:18px;height:18px;font-size:12px;background:var(--surface);border-radius:50%;box-shadow:0 0 0 1px var(--line-2)}
.cmenu .ownadd{width:44px;height:32px;border:1px dashed var(--ink-3);border-radius:4px;justify-content:center;font-size:16px;color:var(--ink-2);padding:0}
.ownramp{display:flex;height:18px;border-radius:3px;overflow:hidden;margin:6px 2px}
.ownramp i{flex:1}
.ownsat{display:flex;align-items:center;gap:8px;padding:2px;font-size:11px;color:var(--ink-2)}
.ownsat input{flex:1;width:auto}
.ownfoot{display:flex;gap:6px;margin-top:8px}
.cmenu .ownfoot button{flex:1;justify-content:center;border:1px solid var(--line-2)}
.cmenu .ownfoot button.on::after{content:none}
.cmenu .ownfoot button.on{background:#2f6fde;color:#fff;border-color:transparent}
/* Timeline / Calendar sits under the deliverables, on the right */
.viewrow{display:flex;justify-content:flex-start;margin:-6px 0 -6px}
/* buttons that were dark text on dark grey: a clear blue with white text */
.btn.pri{background:#2f6fde;color:#fff;border-color:transparent}
.btn.pri:hover{filter:brightness(1.1)}
.pill.wip{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:3px;background:color-mix(in srgb,var(--c) 40%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 80%,var(--ink))}
.pill.holp{background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 7px),var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.pill .cdel{flex:none;width:18px;height:18px;border:0;border-radius:50%;background:transparent;color:var(--bar-ink);opacity:0;cursor:pointer;font-size:13px;line-height:1;padding:0}
.pill:hover .cdel{opacity:.6}
.pill .cdel:hover{opacity:1;background:rgba(0,0,0,.12)}
.palsep{height:1px;background:var(--line-2);margin:4px 0}
.rlab,.corner{display:none!important}
.deliv .dl-h{flex:none;width:170px;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.26em;padding-top:6px}
.dl-grid{flex:1;min-width:0;display:grid;grid-auto-flow:column;column-gap:44px;justify-content:start}
.dl-item{display:grid;grid-template-columns:minmax(150px,1fr) auto 18px;align-items:center;gap:22px;min-width:360px;border-bottom:1px solid var(--line-2);padding:3px 0}
.dl-item.colend{border-bottom:0}
.dl-item input.dn{font-family:var(--mono);font-size:14px;letter-spacing:.1em;text-transform:uppercase;border:1px solid transparent;border-radius:3px;background:transparent;padding:3px 4px;margin-left:-5px;min-width:0}
.dl-item input.dn:hover{border-color:var(--line-2)}
.dl-item input.dn:focus{outline:none;border-color:var(--ink-3);background:var(--surface)}
.dl-item .dd{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:3px 4px;border-radius:3px;white-space:nowrap}
.dl-item .dd:hover{background:var(--raise)}
.dl-item .dd.none{color:var(--ink-3)}
.dl-item .x{width:18px;height:18px;font-size:14px;opacity:0}
.dl-item:hover .x{opacity:1}
.dl-add{align-self:flex-end;flex:none;height:22px;border:0;background:transparent;color:var(--ink-2);font-family:var(--mono);font-size:11px;letter-spacing:.12em;cursor:pointer;padding:0;white-space:nowrap}
.dl-add:hover{color:var(--ink)}
/* the timeline: a label column on the left, then the weeks */
.tl{min-width:0}
.tl-head{position:relative;background:var(--surface)}
.hrow{display:flex}
.corner{flex:none;width:var(--labw);position:sticky;left:0;z-index:7;background:var(--surface);font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--ink-2);display:flex;align-items:center;padding-left:2px}
.track{flex:none;position:relative}
.hr1{height:56px;border-bottom:0}
.wkc{top:0;bottom:0;border-left:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--wkbox);box-shadow:inset 1px 0 0 var(--surface);font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--ink-2);text-transform:uppercase}
.wkc b{color:var(--ink);font-weight:500;margin:0;font-size:12.5px;letter-spacing:.16em}
.hr2{height:30px;border-bottom:1px solid var(--line-2)}
.dc{font-size:11.5px;color:var(--ink-2);flex-direction:row}
.dc.nw{background:var(--nonwork);color:var(--ink-3)}
.dc.hol{color:var(--ink-3)}
.dc.dlv{color:var(--go)}
.dc.today{color:var(--ink);font-weight:700}
.tl-body{position:relative}
svg.links{left:var(--labw)}
.cols{inset:0 0 0 var(--labw)}
.col{border-left:1px solid var(--line)}
.col.wkstart{border-left-color:var(--line-2)}
.col.nw{background:var(--nonwork)}
.col.hol{background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 9px),var(--nonwork)}
.trow,.lane,.droprow{display:flex}
.rlab{flex:none;width:var(--labw);position:sticky;left:0;z-index:6;background:var(--surface);display:flex;align-items:center;padding:0 10px 0 2px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;cursor:pointer;user-select:none}
.rlab span{overflow:hidden;text-overflow:ellipsis}
.rlab:hover{color:var(--ink-2)}
.trow.sel .rlab{font-weight:700}
.lane .rlab,.droprow .rlab{color:var(--ink-2);cursor:default;letter-spacing:.2em}
.rlab input{width:100%;font:inherit;letter-spacing:inherit;text-transform:uppercase;border:1px solid var(--ink-3);border-radius:3px;background:var(--surface);padding:1px 4px}
/* a shared link: read-only, no editing tools */
.vo-note{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);padding:0 6px}
body.viewonly .pal,body.viewonly .splitter,body.viewonly .side,body.viewonly #newBtn,body.viewonly #pick,body.viewonly #undoBtn,body.viewonly #redoBtn,body.viewonly #drive,body.viewonly #dataBtn,body.viewonly #moreMenu,body.viewonly #sideBtn,body.viewonly #shareBtn,body.viewonly .droprow{display:none!important}
body.viewonly .bar,body.viewonly .mk,body.viewonly .cbar,body.viewonly .cev,body.viewonly .lane{cursor:default}
/* the WIP row: a band of its own, a little apart from the schedule rows under it */
.lane{cursor:copy;background:color-mix(in srgb,var(--panel) 70%,transparent);border-top:1px solid var(--line-2);border-bottom:2px solid var(--line-2);position:relative;z-index:1}
.lane .mk.rv{margin:0;transform:none;justify-content:center;height:22px;background:color-mix(in srgb,var(--c) 55%,var(--surface))}
.lane .mk.dl{margin:0;height:22px;color:#fff}
.lanesep{position:absolute;left:0;right:0;height:1px;background:var(--line-2);pointer-events:none}
.lanetag{position:sticky;left:4px;position:absolute;font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--ink-3);pointer-events:none;z-index:0}
/* dark colours get white text */
.bar.dark,.cbar.dark{color:#fff}
.bar.dark .dbadge,.cbar.dark .dbadge{color:#fff;background:rgba(255,255,255,.18)}
.mk.rv.dark,.cev.rv.dark{color:#fff}
.chip.dl,.cev.dl,.mk.dl{color:#fff}
.wipday{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--c) 30%,transparent);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--c) 85%,var(--ink));pointer-events:none}
.trow{border-bottom:1px solid var(--line)}
/* skipped weekends and holidays inside a block: heavy grey with a hint of the block's colour */
.bar .skip{position:absolute;top:0;bottom:0;background:rgba(40,38,34,.11);cursor:pointer;z-index:0}
.bar .skip:hover{background:rgba(40,38,34,.2)}
.bar>.h,.bar>.lbl,.bar>.dbadge,.bar>.cpick,.bar>.subico,.bar>.inl{position:relative;z-index:1}
.droprow{height:46px}
.droprow .hintx{position:sticky;left:calc(var(--labw) + 8px);align-self:center;font-size:12px;color:var(--ink-3);pointer-events:none}
/* calendar view */
.cal{padding:4px 0 10px;gap:0;min-width:760px}
.wkt{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:26px 0 8px}
.wkt:first-child{margin-top:4px}
.wkt b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.18em;margin-right:10px}
/* each week is one boxed block */
.cal .wk{border:1px solid var(--line-2);border-radius:0;background:var(--surface);position:relative;overflow:hidden}   /* only a hairline round the week, no bold dark lines */
.cal .cbg{border-left:0;background:var(--surface)}
.cal .cbg.wknd,.cal .cbg.nw{background:var(--nonwork)}
.cal .cbg.hol{background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 9px),var(--nonwork)}
.cal .cbg.today{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.cal .dh{background:transparent;padding:0;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
/* day names: solid 25% grey, bold black text, no outline; Saturday and Sunday solid 50% grey with white text */
.cal .dh span{display:block;background:#bfbfbf;color:#000;border-radius:0;padding:11px 6px;box-shadow:inset -1px 0 0 rgba(0,0,0,.07);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.cal .dh.wkend span{background:#808080;color:#fff}
.cal .dh.off:not(.wkend) span{background:#a9a9a9}
.cal .dh em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .dr{padding:2px 0;display:flex;gap:0;min-height:0;align-items:stretch;flex-wrap:nowrap}
.cev{flex:0 0 50%;min-width:0;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;touch-action:none;border-radius:0;height:auto}
.cev.rv{background:color-mix(in srgb,var(--c) 45%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 80%,var(--ink))}
.cev.dl{flex-basis:100%;background:var(--go);color:#fff}
.cev.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .cbar{margin:0 0 1px;position:relative}
.cal .cbar .rep{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 4px;white-space:nowrap;pointer-events:none}
.vline{border-left:1px solid rgba(20,18,14,.28);pointer-events:none;z-index:4}
/* embedded schedules */
.subtog{flex:none;width:16px;height:16px;margin-right:4px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;padding:0;font-size:11px;line-height:1}
.subtog:hover{color:var(--ink)}
.subico{flex:none;height:18px;min-width:20px;margin-left:4px;border:0;border-radius:2px;background:rgba(0,0,0,.14);color:var(--bar-ink);font-size:12px;line-height:1;cursor:pointer;padding:0 3px}
.subico:hover{background:rgba(0,0,0,.28)}
.trow.subopen{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.trow.sub{background:color-mix(in srgb,var(--ink) 2%,transparent)}
.trow.sub .rlab{color:var(--ink-2);font-size:10.5px}
.trow.sub .bar{top:5px;bottom:5px}
/* WIPs read as words in a box, not symbols */
.mk.rv{top:50%;height:20px;width:auto;margin:-10px 0 0;transform:translateX(-50%);padding:0 6px;border-radius:2px;background:color-mix(in srgb,var(--c) 30%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 75%,var(--ink));color:var(--ink);font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;white-space:nowrap;box-shadow:none;text-transform:uppercase}
.mk.rv.sel{box-shadow:0 0 0 2px var(--ink)}
.holtag{position:absolute;top:4px;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink-2);text-transform:uppercase;white-space:nowrap;z-index:3;background:var(--surface);padding:0 3px;cursor:pointer;border-radius:2px}
.holtag:hover{color:var(--ink);box-shadow:0 0 0 1px var(--ink-3)}
.dc.hol{cursor:pointer}
/* menus: a × on removable items, and a box to type a new one */
.cmenu button .mdel{margin-left:auto;padding:0 4px;border-radius:3px;color:var(--ink-3);font-size:13px;line-height:1}
.cmenu button .mdel:hover{color:var(--danger);background:var(--raise-2)}
.cmenu button.on .mdel{margin-left:8px}
.cmenu .mi-in{display:flex;gap:6px;padding:4px 6px}
.cmenu .mi-in input{flex:1;min-width:0;height:26px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);padding:0 6px;font:inherit}
.cmenu .mi-in button{width:auto;height:26px;padding:0 10px;background:#2f6fde;color:#fff;justify-content:center}
.cmenu .mi-in button:hover{background:#2f6fde;filter:brightness(1.1)}
/* print preview */
.pview{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;background:#6f6c66}
.pv-bar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.pv-bar b{font-weight:600}
.pv-bar span{color:var(--ink-2);font-size:12px}
.pv-bar .grow{flex:1}
.pview iframe{flex:1;width:100%;border:0;background:#8d8a83}
/* New schedule: the public holidays in the job, each on or off */
.holgrid{display:flex;flex-wrap:wrap;gap:6px}
.holp2{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 10px;border-radius:6px;border:1px solid var(--line-2);background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 7px),var(--surface);cursor:pointer;text-align:left;min-width:150px}
.holp2 b{font-size:12.5px;font-weight:600}
.holp2 small{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.holp2 em{font-style:normal;font-size:10.5px;color:var(--ink-2)}
.holp2.work{background:var(--surface);opacity:.7}
.holp2.work b{text-decoration:line-through}
/* the preset tray under the schedule */
.tray{flex:none;max-height:36vh;overflow:auto;border-top:1px solid var(--line-2);background:var(--panel);padding:10px max(24px,env(safe-area-inset-right,0px)) 12px max(24px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px 18px;align-items:flex-start}
.tg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.tg.open{flex-basis:100%}
.tgh{height:26px;border:0;background:transparent;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;padding:0 4px;display:inline-flex;align-items:center;gap:6px}
.tgh:hover{color:var(--ink)}
.tgh small{color:var(--ink-3);letter-spacing:0}
.tbox{height:28px;display:inline-flex;align-items:center;gap:8px;padding:0 10px;border-radius:3px;background:color-mix(in srgb,var(--c,var(--ink-3)) 38%,var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--ink-3)) 70%,transparent);color:var(--ink);font-size:12px;font-weight:500;cursor:grab;user-select:none;touch-action:none;white-space:nowrap}
.tbox small{font-family:var(--mono);font-size:10px;color:var(--ink-2)}
.tbox.wip{font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.tbox.hol{background:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 7px),var(--surface);border-color:var(--line-2)}
.tbox.out{--c:var(--go)}
.tbox.dragghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-30%,-50%);opacity:.92;box-shadow:var(--shadow)}
/* right-click and pick-list menus */
.cmenu{position:fixed;z-index:95;min-width:190px;max-height:min(70vh,520px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:var(--shadow);padding:4px;font-size:12.5px}
.cmenu button{display:flex;align-items:center;gap:8px;width:100%;height:28px;border:0;background:transparent;border-radius:4px;padding:0 10px;cursor:pointer;text-align:left;white-space:nowrap}
.cmenu button:hover,.cmenu button:focus-visible{background:var(--raise)}
.cmenu button.on::after{content:"✓";margin-left:auto;color:var(--ink-2)}
.cmenu button.danger{color:var(--danger)}
.cmenu .mh{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 3px}
.cmenu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.cmenu .swatches{padding:4px 10px 6px}
.cmenu .swatches button{width:20px;height:20px;padding:0;border-radius:4px;background:var(--c)}
@media (max-width:900px){
  .projhead{flex-direction:column;align-items:stretch}
  .facts{flex-wrap:wrap;gap:12px 0}
  .fact{padding:0 16px 0 0;border-left:0;min-width:140px}
  .deliv{flex-direction:column;gap:10px}
  .dl-grid{grid-auto-flow:row;grid-template-rows:none!important;grid-template-columns:minmax(0,1fr)!important}
  .dl-item{min-width:0}
  :root{--labw:130px}
}
@media (max-width:900px){
  .main{flex-direction:column;gap:10px}
  .pal{width:auto;max-height:150px}
  .pal-body{flex-direction:row;flex-wrap:wrap}
  .pal-body .pill{max-width:180px}
  .splitter{display:none}
  .side{width:auto;max-width:none;min-width:0;height:40%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><i></i>Schedule</div>
  <select class="in" id="pick" aria-label="Open schedule" style="max-width:240px"></select>
  <button class="btn pri" id="newBtn">New schedule</button>
  <div class="grow"></div>
  <button class="btn ghost" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
  <button class="btn ghost" id="redoBtn" title="Redo (Ctrl+Shift+Z)">Redo</button>
  <button class="btn ghost" id="drive" title="Every schedule is kept in a Schedules folder in your Google Drive">Connect Google Drive</button>
  <button class="btn" id="shareBtn" title="Make a link to send: whoever opens it sees this schedule, read-only">Share</button>
  <button class="btn" id="pdfBtn" title="Print on A4 landscape — choose Save as PDF in the print window to make a PDF to send">Print / PDF</button>
  <span class="vo-note" id="voNote" hidden>Shared schedule · view only</span>
  <button class="btn" id="dataBtn">Export / import</button>
  <button class="btn ghost" id="moreMenu" title="Weekends, public holidays, duplicate or delete this schedule" aria-label="More">⋯</button>
  <button class="btn" id="sideBtn" title="Open the side panel: the assistant, and the crew overview">Panel</button>
</div>

<div class="main">
  <aside class="pal" id="pal" aria-label="Pills: drag onto the schedule">
    <div class="pal-top">
      <div class="themepick" title="Colour theme"><button class="ramp" id="ramp" title="Make your own colours: pick 2 to 4 and set the saturation" aria-label="Make your own colour theme"></button><select class="in" id="themeSel" aria-label="Colour theme"></select></div>
      <select class="in" id="palCat" aria-label="Which pills"></select>
    </div>
    <div class="pal-body" id="palBody"></div>
  </aside>
  <div class="mcol">
  <div class="doc" id="doc">
    <div class="projhead" id="projhead"></div>
    <div class="deliv" id="deliv"></div>
    <div class="viewrow"><div class="seg" aria-label="View">
      <button id="vTimeline" class="on" title="Block the project out">Timeline</button>
      <button id="vCalendar" title="The version to share with clients">Calendar</button>
    </div></div>
    <div class="boardcol">
      <div class="boardwrap">
        <div class="board" id="board"></div>
        <div class="zbar" id="zbar"><!-- Kontroll's Video Edit bottom row: zoom out · slider · zoom in, then the scroll bar -->
          <button id="zOut" title="Zoom out (-)" aria-label="Zoom out"><svg viewBox="0 0 16 10" width="11" height="7" fill="currentColor"><path d="M0 10 5 3l3 3.5L11 2l5 8z"/></svg></button>
          <input type="range" id="zoom" min="0" max="1000" value="500" title="Timeline zoom (+/-). All the way left shows the whole job." aria-label="Timeline zoom">
          <button id="zIn" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 16 10" width="17" height="11" fill="currentColor"><path d="M0 10 5 3l3 3.5L11 2l5 8z"/></svg></button>
          <div class="hs" id="hs" title="Scroll the timeline"><div class="hs-thumb" id="hsThumb"></div></div>
        </div>
      </div>
    </div>
  </div>
  </div>
  <div class="splitter" id="splitter" title="Drag to resize"></div>
  <aside class="side" id="side">
    <div class="side-tabs">
      <button id="tAI" class="on">Assistant</button>
      <button id="tDetails">Details</button>
      <button class="x" id="sideClose" title="Close the panel" aria-label="Close the panel" style="flex:none;width:36px;height:36px">×</button>
    </div>
    <div class="side-body">
      <div id="ai">
        <div class="msgs" id="msgs"></div>
        <form id="aiForm">
          <label class="aimodel" id="aiModelRow" hidden><span>Assistant</span><select class="in" id="aiModel" aria-label="Which assistant"></select></label>
          <textarea class="in" id="aiIn" placeholder="Tell the assistant what to build or change, e.g. build a 6-week 3D job starting 1 December with two animators"></textarea>
          <div class="aibar"><button type="button" class="btn ghost aiic" id="aiMic" title="Dictate (Kontroll's mic)" aria-label="Dictate"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><span class="st" id="aiStatus"></span><button type="button" class="btn" id="aiStop" hidden>Stop</button><button type="submit" class="btn pri" id="aiSend">Send</button></div>
        </form>
      </div>
      <div id="details" hidden></div>
    </div>
  </aside>
</div>

<div class="scrim" id="wiz" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="New schedule">
    <div class="wz-top"><div class="dots" id="wzDots"></div><span class="wz-step" id="wzStep"></span><button class="x" id="wzClose" aria-label="Close">×</button></div>
    <div class="wz-body" id="wzBody"></div>
    <div class="wz-foot"><button class="btn ghost" id="wzBack">Back</button><span class="grow muted" id="wzNote" style="font-size:12px"></span><button class="btn ghost" id="wzSkip" title="Leave this step as it is and go on">Skip</button><button class="btn" id="wzNext">Next</button><button class="btn pri" id="wzGo">Create schedule</button></div>
  </div>
</div>

<div class="scrim" id="dataDlg" hidden>
  <div class="modal dlg" role="dialog" aria-labelledby="dataT">
    <header><h2 id="dataT">Export / import</h2><p>This JSON is the whole schedule. Kontroll will read the same format.</p></header>
    <div class="mbody">
      <textarea class="in mono" id="dataTxt" rows="14" style="font-size:11.5px"></textarea>
      <div class="hint" id="dataMsg"></div>
    </div>
    <div class="mfoot"><span class="grow">To import, paste a schedule's JSON above, then choose Import.</span><button class="btn" id="dataCopy">Copy</button><button class="btn" id="dataImport">Import as new</button><button class="btn pri" id="dataClose">Done</button></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer onload="window.gsiLoaded=true;window.initGoogle&&window.initGoogle()"></script>
<script>
(() => {
"use strict";
/* =========================================================
   Library: project types, stages (pills), roles, themes
   ========================================================= */
const TYPES = [
  { key: "3d", name: "3D animation", desc: "Modeling, rigging, animation, lighting, comp" },
  { key: "2d", name: "2D animation", desc: "Layout, backgrounds, animation, clean-up" },
  { key: "stop", name: "Stop motion", desc: "Puppet and set build, a long animated shoot" },
  { key: "live", name: "Live action", desc: "Pre-production, a shoot, edit and post" },
  { key: "mini", name: "Miniatures & models", desc: "Physical model build and a model shoot" },
  { key: "ai", name: "AI", desc: "Look development, generation, upscale and clean-up" },
];
const CG = ["3d", "2d", "stop", "mini", "ai"];
const any = (...k) => ts => k.some(x => ts.includes(x));
const liveWithCG = ts => ts.includes("live") && CG.some(x => ts.includes(x));
// s/l: rough start and length as a fraction of the job; deps: what it follows, first one present wins
const LIB = [
  { key: "brief", name: "Brief & treatment", role: "Director", when: () => false, s: 0, l: .05, deps: [] },
  { key: "preprod", name: "Pre-production", role: "Producer", when: any("live", "stop", "mini"), s: 0, l: .18, deps: ["brief"] },
  { key: "concept", name: "Concept & design", role: "Concept artists", when: any("3d", "2d", "stop", "ai", "mini"), s: 0, l: .14, deps: ["brief"] },
  { key: "casting", name: "Casting", role: "Casting", when: () => false, s: .04, l: .1, deps: ["preprod"], preshoot: true },
  { key: "location", name: "Location recce", role: "Locations", when: () => false, s: .04, l: .08, deps: ["preprod"], preshoot: true },
  { key: "wardrobe", name: "Wardrobe, props & art", role: "Art department", when: () => false, s: .1, l: .1, deps: ["casting", "location"], preshoot: true },
  { key: "rehearse", name: "Table read & rehearsals", role: "Director", when: () => false, s: .18, l: .04, deps: ["casting"], preshoot: true },
  { key: "techrecce", name: "Tech recce & camera tests", role: "DOP", when: () => false, s: .2, l: .02, deps: ["location"], preshoot: true },
  { key: "story", name: "Storyboard", role: "Storyboard artists", when: any("3d", "2d", "stop", "live"), s: .05, l: .12, deps: ["concept", "preprod", "brief"] },
  { key: "animatic2d", name: "Animatic", role: "Storyboard artists", when: ts => any("2d", "stop")(ts) && !ts.includes("3d"), s: .14, l: .12, deps: ["story"] },
  { key: "animatic", name: "3D animatic", role: "Layout artists", when: any("3d"), s: .14, l: .16, deps: ["story", "concept"] },

  R.forEach(v => { if (v.start < a) a = v.start; if (v.end > b) b = v.end; });
  [...S.reviews, ...S.deliveries].forEach(r => { if (validDate(r.date)) { if (r.date < a) a = r.date; if (r.date > b) b = r.date; } });
  a = addDays(a, -((dow(a) + 6) % 7));
  b = addDays(b, (7 - dow(b)) % 7 + 7);
  const days = []; for (let d = a; d <= b && days.length < 800; d = addDays(d, 1)) days.push(d);
  return days;
}
function weekNo(d) { const m0 = addDays(S.start, -((dow(S.start) + 6) % 7)); return Math.floor(diffDays(m0, d) / 7) + 1; }
function renderBoard() {
  const b = $("board"), sl = b.scrollLeft, st = b.scrollTop;
  b.classList.toggle("tlmode", VIEW === "timeline");
  $("zbar").hidden = VIEW !== "timeline";
  b.innerHTML = VIEW === "timeline" ? timelineHTML(VIEW_ONLY) : calendarHTML();
  b.scrollLeft = sl; b.scrollTop = st;
  if (typeof hsSoon === "function") hsSoon();
  if (VIEW === "timeline" && !D) syncZoom();
}
function geom(days) {
  const xs = [], ws = [], idx = {}; let x = 0;
  days.forEach((d, i) => { xs.push(x); ws.push(DAYW); idx[d] = i; x += DAYW; });   // every day the same width; weekends are greyed, not narrowed
  return { xs, ws, idx, total: x, days };
}
const xOf = d => { const i = GEO.idx[d]; return i == null ? null : GEO.xs[i]; };
const xEnd = d => { const i = GEO.idx[d]; return i == null ? null : GEO.xs[i] + GEO.ws[i]; };
const delivDates = () => new Set(S.deliveries.map(d => d.date));

/* Embedded schedules (Christian 2026-11-13): any block can hold a schedule of its own — rows with parent = that block. The block
   shows a ▦ icon; clicking it opens those rows indented underneath, and again closes them. Rows inside can embed further. */
const kidsOf = t => S.tasks.filter(x => x.parent === t.id);
function visTasks() {   // rows in the order shown: each open block's own rows straight after it
  const kids = new Map(); S.tasks.forEach(t => { const p = t.parent || ""; if (!kids.has(p)) kids.set(p, []); kids.get(p).push(t); });
  const out = [], walk = (p, depth) => (kids.get(p) || []).forEach(t => { out.push({ t, depth }); if (t.sub && t.open) walk(t.id, depth + 1); });
  walk("", 0); return out;
}
function embedSchedule(t) {
  change(() => {
    t.sub = true; t.open = true;
    if (!kidsOf(t).length) {
      const st = R.get(t.id).start, k = { id: uid("t"), name: "New block", color: t.color, people: 1, days: Math.max(1, Math.min(5, t.days | 0)), notes: "", mode: "start", after: null, lag: 0, date: null, parent: t.id };
      S.tasks.splice(S.tasks.indexOf(t) + 1, 0, k); R = resolve(); setStart(k, st);
    }
  });
  toast(`${t.name} now holds its own schedule. Lay it out in the rows underneath; ▾ by its name closes it.`);
}
function barInner(t, w, editable) {
  const big = w >= 96, mid = w >= 46;
  return `<span class="h" data-edge="start"></span>${t.sub ? `<button class="subico" data-sub="${t.id}" title="${t.open ? "Close" : "Open"} the schedule inside ${esc(t.name)}" aria-label="${t.open ? "Close" : "Open"} the embedded schedule">▦</button>` : ""}${big ? `<span class="lbl">${esc(t.name)}</span>` : `<span class="lbl"></span>`}${editable && w >= 30 ? `<button class="cpick" data-colpick="${t.id}" title="Change this block's colour" aria-label="Change the colour of ${esc(t.name)}"></button>` : ""}${mid ? `<button class="dbadge" data-days="${t.id}" title="Click to type a length">${t.days}d</button>` : ""}<span class="h" data-edge="end"></span>${editable ? `<span class="knob" data-knob="${t.id}" title="Drag onto another task to make it follow this one"></span>` : ""}`;
}
// part (printing): {from, to} = which rows, lane:false = without the deliverables / WIP band (later pages repeat only the weeks)
function timelineHTML(ro, part = {}) {
  const days = dayRange(), G = GEO = geom(days), today = ro ? "" : todayIso(), pe = projEnd(), dlv = delivDates(), LW = labw();
  let wk = "", dc = "", cols = "", hols = "";
  for (let i = 0; i < days.length; i += 7) {   // a grey box per week: WEEK n, its Monday under it
    let w = 0; for (let j = i; j < i + 7 && j < days.length; j++) w += G.ws[j];
    const n = weekNo(days[i]);
    wk += `<div class="wkc" style="left:${G.xs[i]}px;width:${w}px"><b>${n > 0 ? "WEEK " + n : "BEFORE"}</b>${w >= 90 ? esc(fmt(days[i])) : ""}</div>`;
  }
  days.forEach((d, i) => {
    const work = isWork(d), hol = isHoliday(d);
    const cls = [work ? "" : "nw", hol ? "hol" : "", dlv.has(d) ? "dlv" : "", d === today ? "today" : ""].join(" ");
    const tip = `${fmt(d)}${hol ? ": " + (S.holidays.find(h => h.date === d).name || "Holiday") : work ? "" : " (not worked)"}. Double-click to ${isWeekend(d) && S.skipWeekends && !hol ? (work ? "stop working it" : "work this day") : (hol ? "remove the holiday" : "mark as a holiday")}.`;
    dc += `<div class="dc ${cls}" data-date="${d}" title="${esc(tip)}" style="left:${G.xs[i]}px;width:${G.ws[i]}px">${G.ws[i] >= 10 ? WD[dow(d)][0] : ""}</div>`;
    cols += `<div class="col ${cls} ${dow(d) === 1 ? "wkstart" : ""} ${d === pe ? "pend" : ""}" style="left:${G.xs[i]}px;width:${G.ws[i]}px"></div>`;
    if (hol) hols += `<div class="holtag" ${ro ? "" : `data-holday="${d}" title="${esc(S.holidays.find(h => h.date === d).name || "Holiday")} · click to remove it and work this day"`} style="left:${G.xs[i] + G.ws[i] / 2}px">${esc((S.holidays.find(h => h.date === d).name || "Holiday").length > 14 && G.ws[i] < 60 ? "Holiday" : (S.holidays.find(h => h.date === d).name || "Holiday"))}</div>`;
  });
  /* The WIP row (Christian 2026-11-13): set a little apart from the schedule; WIPs on the same day stack one under another and the row
     grows to fit; each WIP starts on its own day, and that day is tinted in its colour so it's clear which day it is. */
  // two rows in one band: deliverables on top, WIPs under them (as many WIP rows as the busiest day needs)
  const stack = {}, IH = 22, IG = 3, DR = LANE_DR; let marks = hols, tints = "";
  const itemsOn = {}; S.reviews.forEach(r => (itemsOn[r.date] = itemsOn[r.date] || []).push(r));
  const laneRows = Math.max(1, ...Object.values(itemsOn).map(a => a.length)), laneH = DR + 8 + laneRows * (IH + IG);
  LANEH = laneH + LANEGAP;
  marks += `<div class="lanesep" style="top:${DR}px"></div><span class="lanetag" style="top:${DR + 4}px">WIPS</span><span class="lanetag" style="top:4px">DELIVERABLES</span>`;
  const slot = date => { const k = stack[date] = (stack[date] || 0) + 1; return DR + 5 + (k - 1) * (IH + IG); };
  S.reviews.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id < b.id ? -1 : 1).forEach(r => {
    const x = xOf(r.date); if (x == null) return;
    const w = G.ws[G.idx[r.date]];
    if (!stack[r.date]) tints += `<div class="wipday" style="left:${x}px;width:${w}px;top:${DR}px;--c:var(--c${r.color ?? 6})"></div>`;
    marks += `<div class="mk rv ${SEL && SEL.id === r.id ? "sel" : ""}" data-rid="${r.id}" title="${esc(r.type + " · " + fmt(r.date) + (r.note ? " · " + r.note : "") + " · click to change the type")}" style="left:${x + 1}px;top:${slot(r.date)}px;min-width:${Math.max(0, w - 2)}px;--c:var(--c${r.color ?? 6})">${esc(rvShort(r.type))}</div>`;
  });
  S.deliveries.forEach(d => {
    const x = xOf(d.date); if (x == null) return;
    marks += `<div class="mk dl ${SEL && SEL.id === d.id ? "sel" : ""}" data-did="${d.id}" title="${esc("Delivery " + fmt(d.date) + ": " + deliveryLabel(d) + ". Drag to move it.")}" style="left:${x + 1}px;top:4px">▶ ${esc(deliveryLabel(d))}</div>`;
  });
  marks = tints + marks;
  // tasks
  const withLane = part.lane !== false, laneOff = withLane ? LANEH : 0;
  const rows = [], links = [], VIS = visTasks().slice(part.from || 0, part.to == null ? undefined : part.to), vi = new Map(VIS.map((x, i) => [x.t.id, i]));
  VIS.forEach(({ t, depth }, i) => {
    const v = R.get(t.id), x1 = xOf(v.start), x2 = xEnd(v.end), w = (x2 ?? 0) - (x1 ?? 0);
    const nk = t.sub ? kidsOf(t).length : 0;
    const tog = t.sub ? `<button class="subtog" ${ro ? "" : `data-sub="${t.id}"`} title="${t.open ? "Close" : "Open"} the schedule inside ${esc(t.name)} (${nk} row${nk === 1 ? "" : "s"})" aria-expanded="${!!t.open}">${t.open ? "▾" : "▸"}</button>` : "";
    const sel = isPicked(t.id);
    let inner = "";
    if (x1 != null) {
      // skipped days inside the block (weekends, holidays) fade to grey with a hint of its colour; click one to work it
      let skips = "";
      for (let d = v.start; d <= v.end; d = addDays(d, 1)) if (!isWork(d) && GEO.idx[d] != null) skips += `<span class="skip" ${ro ? "" : `data-skipday="${d}"`} title="${esc(fmt(d) + (isHoliday(d) ? " · holiday" : " · skipped") + " · click to work it")}" style="left:${xOf(d) - x1}px;width:${G.ws[G.idx[d]]}px"></span>`;
      inner = `<div class="bar ${sel ? "sel" : ""} ${darkCls(t.color)}" data-tid="${t.id}" title="${esc(`${t.name} · ${fmt(v.start)} to ${fmt(v.end)} · ${t.days} working day${t.days === 1 ? "" : "s"}`)}" style="left:${x1}px;width:${w}px;--c:var(--c${t.color})">${skips}${barInner(t, w, true)}</div>`;
      if (w < 96) inner += `<div class="outlbl" style="left:${x2 + 16}px">${esc(t.name)}${w < 46 ? ` <span class="mono">${t.days}d</span>` : ""}</div>`;
    }
    rows.push(`<div class="trow ${sel ? "sel" : ""} ${depth ? "sub" : ""} ${t.sub && t.open ? "subopen" : ""}" data-row="${i}" data-tid-row="${t.id}"><div class="rlab" style="padding-left:${2 + depth * 14}px" ${ro ? "" : `data-lab="${t.id}" title="Click to pick a name from the list · double-click to type one"`}>${tog}<span>${esc(t.name)}</span></div><div class="track" style="width:${G.total}px">${inner}</div></div>`);
    if (t.mode === "after") {
      const pi = vi.has(t.after) ? vi.get(t.after) : -1;
      if (pi >= 0) {
        const pv = R.get(t.after), xe = xEnd(pv.end), xs = xOf(v.start);
        if (xe != null && xs != null) {
          const y1 = laneOff + ROWH * pi + ROWH / 2, y2 = laneOff + ROWH * i + ROWH / 2;
          const mx = Math.max(xe + 10, Math.min(xs - 10, xe + 10));
          const d = xs - 12 >= xe + 10 ? `M${xe} ${y1} H${xs - 12} V${y2} H${xs - 6}` : `M${xe} ${y1} H${xe + 10} V${(y1 + y2) / 2} H${xs - 12} V${y2} H${xs - 6}`;
          links.push(`<g data-link="${t.id}"><path class="hit" data-lh="${t.id}" d="${d}"/><path class="ln" d="${d}"/><circle class="lh" data-lh="${t.id}" cx="${xs - 6}" cy="${y2}" r="4.5"><title>Drag off to unlink, or onto another task to move the link</title></circle></g>`);
        }
      }
    }
  });
  const bodyH = laneOff + ROWH * VIS.length, W = G.total;
  return `<div class="tl" style="width:${LW + W + 24}px">
    <div class="tl-head">
      <div class="hrow"><div class="corner"></div><div class="track hr1" style="width:${W}px">${wk}</div></div>
      <div class="hrow"><div class="corner">WEEK</div><div class="track hr2" id="dayhead" style="width:${W}px">${dc}</div></div>
    </div>
    <div class="tl-body" id="tlBody">
      <div class="cols" style="width:${W}px">${cols}</div>
      <svg class="links" width="${W}" height="${bodyH}" aria-hidden="true">${links.join("")}</svg>
      ${withLane ? `<div class="lane" data-lane="rev" style="height:${laneH}px;margin-bottom:${LANEGAP}px" title="WIPs and deliveries: click an empty day to add a WIP"><div class="rlab">Reviews</div><div class="track" style="width:${W}px">${marks}</div></div>` : ""}
      ${rows.join("")}
      ${ro ? "" : `<div class="droprow" data-drop="end"><div class="rlab"></div><span class="hintx">${S.tasks.length ? "Drag a pill from the left to add a row · right-click anywhere for a new block" : "No tasks yet. Drag stages or people from the pills on the left, or right-click to make a new block."}</span></div>`}
    </div></div>`;
}

function calendarHTML() {
  /* Calendar (Christian 2026-11-13): every week is a block of all seven days with "WEEK n" above it; a dark bar on top with each
     day's name cut out in a light box; Saturday and Sunday greyed; the day lines run through every coloured block. A delivery is
     a full one-day block, a WIP a half-day block (two fit in a day), both as tall as a task block. */
  const days = dayRange().slice(0, -7), today = todayIso();
  const colDays = [1, 2, 3, 4, 5, 6, 0], C = 7, VIS = visTasks().map(x => x.t);
  let h = `<div class="cal">`;
  for (let i = 0; i < days.length; i += 7) {
    const wkDays = colDays.map(w => days[i + ((w + 6) % 7)]).filter(Boolean);
    const wkEnd = days[Math.min(i + 6, days.length - 1)];
    const active = VIS.filter(t => { const v = R.get(t.id); return v.start <= wkEnd && v.end >= days[i]; });
    if (!active.length && !S.reviews.some(r => r.date >= days[i] && r.date <= wkEnd) && !S.deliveries.some(r => r.date >= days[i] && r.date <= wkEnd) && (days[i] > projEnd() || wkEnd < projStart())) continue;
    // event lines: each line holds one delivery or up to two WIPs per day
    const perDay = wkDays.map(d => {
      const lines = [];
      S.deliveries.filter(x => x.date === d).forEach(x => lines.push([{ dl: x }]));
      const rv = S.reviews.filter(r => r.date === d).sort((a, b) => a.id < b.id ? -1 : 1);
      for (let j = 0; j < rv.length; j += 2) lines.push(rv.slice(j, j + 2).map(r => ({ rv: r })));
      return lines;
    });
    const EL = Math.max(1, ...perDay.map(l => l.length));
    const n = weekNo(days[i]);
    let g = `<div class="wkt"><b>${n > 0 ? "WEEK " + n : "BEFORE"}</b> ${esc(fmt(days[i]))}</div>
      <section class="wk" style="grid-template-columns:repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.5fr));grid-template-rows:auto repeat(${EL},32px) ${active.length ? `repeat(${active.length},32px)` : ""} 8px">`;
    wkDays.forEach((d, k) => {
      const work = isWork(d), hol = isHoliday(d), wknd = isWeekend(d);
      g += `<div class="cbg ${work ? "" : "nw"} ${wknd ? "wknd" : ""} ${hol ? "hol" : ""} ${d === today ? "today" : ""}" data-date="${d}" style="grid-column:${k + 1};grid-row:1/-1"></div>`;
      const hn = hol ? (S.holidays.find(x => x.date === d).name || "Holiday") : "";
      g += `<div class="dh ${wknd ? "wkend" : ""} ${!work ? "off" : ""}" data-date="${d}" style="grid-column:${k + 1};grid-row:1" title="${esc(fmt(d) + (hn ? ": " + hn : "") + (wknd ? (work ? " · worked (right-click to skip it)" : " · skipped (right-click to work it)") : ""))}"><span>${WD[dow(d)]} ${parse(d).getUTCDate()}${wknd ? "" : " " + MON[parse(d).getUTCMonth()]}</span>${hn ? `<em>${esc(hn)}</em>` : ""}</div>`;
      for (let l = 0; l < EL; l++) {
        const line = perDay[k][l] || [];
        const inner = line.map(x => x.dl
          ? `<div class="cev dl ${SEL && SEL.id === x.dl.id ? "sel" : ""} chip" data-did="${x.dl.id}" title="${esc("Delivery " + fmt(d) + ": " + deliveryLabel(x.dl))}">${esc(deliveryLabel(x.dl))} delivery</div>`
          : `<div class="cev rv ${SEL && SEL.id === x.rv.id ? "sel" : ""} chip" data-rid="${x.rv.id}" title="${esc(x.rv.type + (x.rv.note ? " · " + x.rv.note : ""))}" style="--c:var(--c${x.rv.color ?? 6})">${esc(rvShort(x.rv.type))}</div>`).join("");
        g += `<div class="dr" data-date="${d}" style="grid-column:${k + 1};grid-row:${l + 2}">${inner}</div>`;
      }
    });
    active.forEach((t, ri) => {
      // a block only covers the days that are worked: it stops before a skipped Saturday / Sunday (or a holiday) and carries on after
      const v = R.get(t.id), runs = []; let cur = null;
      wkDays.forEach((d, k) => { const on = d >= v.start && d <= v.end && isWork(d); if (on) { if (cur && cur.b === k - 1) cur.b = k; else runs.push(cur = { a: k, b: k }); } });
      const sel = isPicked(t.id);
      // a block that covers Monday through at least Thursday shows its name again on Wednesday (Christian 2026-11-13)
      const cw = k => k < 5 ? 1 : .5, rep = (a, b, t) => { if (!(a === 0 && b >= 3)) return ""; let before = 0, all = 0; for (let k = a; k <= b; k++) { all += cw(k); if (k < 2) before += cw(k); } return `<span class="rep" style="left:${(before / all * 100).toFixed(2)}%">${esc(t.name)}</span>`; };
      runs.forEach(({ a, b }, j) => {
        const first = wkDays[a] === v.start, last = wkDays[b] === v.end, cont = !first;
        g += `<div class="cbar ${cont ? "cl" : ""} ${!last ? "cr" : ""} ${sel ? "sel" : ""} ${darkCls(t.color)}" data-tid="${t.id}" title="${esc(`${t.name} · ${fmt(v.start)} to ${fmt(v.end)} · ${t.days} days`)}" style="grid-column:${a + 1}/${b + 2};grid-row:${ri + EL + 2};--c:var(--c${t.color})">${first ? `<span class="h" data-edge="start"></span>` : ""}<span class="lbl">${j === 0 ? esc(t.name) + (cont ? " (cont.)" : "") : ""}</span>${last ? `<span class="dbadge">${t.days}d</span><span class="h" data-edge="end"></span>` : ""}${rep(a, b, t)}</div>`;
      });
    });
    // the day lines, drawn on top so they show through every block
    for (let k = 1; k < C; k++) g += `<div class="vline" style="grid-column:${k + 1};grid-row:2/-1"></div>`;
    h += g + `</section>`;
  }
  return h + `</div>`;
}

   Details panel
