const swatches = (cur, attr) => `<div class="swatches">${[...Array(10).keys()].map(i => `<button type="button" ${attr}="${i}" class="${i === cur ? "on" : ""}" style="--c:var(--c${i})" aria-label="Colour ${i + 1}"></button>`).join("")}</div>`;
const head = (title, extra = "") => `<div style="display:flex;align-items:center;gap:8px">${extra}<h3 style="flex:1">${title}</h3><button class="btn ghost sm" data-act="deselect">Project</button></div>`;
/* Details is only the crew overview now (Christian 2026-11-13): each kind of artist, how many, and their total time on the job —
   people × working days, added up over every row for that role — in days or weeks. A stage row counts toward its role
   (Texturing & lookdev → Texture artists); a row named after a role counts as that role. */
let CREW_UNIT = "weeks";
// above the line: the creative leads and talent (writers, director, producers, cast, voices); everyone else is below the line
const ATL_ROLES = new Set(["Producer", "Director", "Writers", "Voice talent", "Cast"]);
function crewRoles() {
  const roleOf = t => { const l = LIB.find(x => x.name === t.name); return l ? l.role : t.name; };
  const m = new Map();
  S.tasks.forEach(t => {
    if (t.sub && kidsOf(t).length) return;   // a block with its own schedule: its rows hold the crew, not the block
    const k = roleOf(t), r = m.get(k) || { role: k, people: 0, pdays: 0, rows: [] };
    r.people = Math.max(r.people, +t.people || 0); r.pdays += (+t.people || 0) * Math.max(1, t.days | 0); r.rows.push(t.id); m.set(k, r);
  });
  return [...m.values()];
}
function renderDetails() {
  const el = $("details"); if (!el) return;
  const rows = crewRoles(), per = S.skipWeekends ? 5 : 7;
  const amt = d => CREW_UNIT === "weeks" ? `${+(d / per).toFixed(1)} wk` : `${d} d`;
  const peak = rows.reduce((a, r) => a + r.people, 0), tot = rows.reduce((a, r) => a + r.pdays, 0);
  el.innerHTML = `<div class="sec"><div style="display:flex;align-items:center;gap:8px"><h3 style="flex:1">Crew</h3>
      <div class="seg"><button data-unit="days" class="${CREW_UNIT === "days" ? "on" : ""}">Days</button><button data-unit="weeks" class="${CREW_UNIT === "weeks" ? "on" : ""}">Weeks</button></div></div>
    ${rows.length ? `<table class="crewtab"><thead><tr><th>Role</th><th style="text-align:right">People</th><th style="text-align:right">Total</th></tr></thead><tbody>
      ${[["Above the line", true], ["Below the line", false]].map(([h, atl]) => { const list = rows.map((r, i) => [r, i]).filter(([r]) => ATL_ROLES.has(r.role) === atl); return list.length ? `<tr class="crewh"><td colspan="3">${h}</td></tr>` + list.map(([r, i]) => `<tr><td>${esc(r.role)}</td><td class="n"><span class="step"><button data-crew="${i}" data-d="-1" aria-label="Fewer ${esc(r.role)}">−</button><span>${r.people}</span><button data-crew="${i}" data-d="1" aria-label="More ${esc(r.role)}">+</button></span></td><td class="n" title="${r.pdays} person-days">${amt(r.pdays)}</td></tr>`).join("") : ""; }).join("")}</tbody>
      <tfoot><tr><td>All crew</td><td class="n">${peak}</td><td class="n">${amt(tot)}</td></tr></tfoot></table>
      <p class="hint">Total is people × working days on every row for that role. Changing the people sets it on all of that role's rows.</p>`
      : `<p class="hint">No rows yet. Drag people or stages in from the tray.</p>`}</div>`;
}
function taskPanel(t) {
  const v = R.get(t.id), deps = dependents(t.id), pred = t.mode === "after" ? taskById(t.after) : null;
  return `<div class="sec">${head("Task", `<span class="sw" style="--c:var(--c${t.color});width:14px;height:14px"></span>`)}
    <label class="fld"><span>Name</span><input class="in" id="pt-name" data-tf="name" value="${esc(t.name)}"></label>

/* =========================================================
   Selection, toast
   ========================================================= */
/* Several blocks at once (Christian 2026-11-13): Shift-click adds a block to the selection (or takes it out). Dragging any selected
   block moves them all, dragging one's end lengthens or shortens them all by the same number of days, Delete removes them all.
   A plain click on a block, or on empty space, goes back to one / none. */
let MULTI = new Set();
let VIEW_ONLY = false;   // opened from a Share link
const isPicked = id => MULTI.has(id) || (SEL && SEL.kind === "task" && SEL.id === id);
function pickedTasks() { const ids = new Set(MULTI); if (SEL && SEL.kind === "task") ids.add(SEL.id); return S.tasks.filter(t => ids.has(t.id)); }
function shiftPick(id) {
  if (SEL && SEL.kind === "task") MULTI.add(SEL.id);
  if (MULTI.has(id)) MULTI.delete(id); else MULTI.add(id);
  SEL = MULTI.size ? { kind: "task", id: MULTI.has(id) ? id : [...MULTI][MULTI.size - 1] } : null;
  if (!MULTI.has(SEL && SEL.id)) MULTI.clear();
  paintSel();
  if (MULTI.size > 1) toast(`${MULTI.size} blocks selected. Drag one to move them all, drag an end to lengthen them all, Delete removes them.`);
}
function paintSel() {
  document.querySelectorAll(".sel").forEach(e => e.classList.remove("sel"));
  if (SEL && SEL.kind !== "task") { const attr = { review: "data-rid", delivery: "data-did", pill: "data-pill", rpill: "data-rpill", output: "data-out" }[SEL.kind]; document.querySelectorAll(`[${attr}="${SEL.id}"]`).forEach(e => { if (e.matches(".mk,.chip,.pill,.cev")) e.classList.add("sel"); }); }
  pickedTasks().forEach(t => document.querySelectorAll(`[data-tid="${t.id}"]`).forEach(e => { if (e.matches(".bar,.cbar")) e.classList.add("sel"); }));
}
function select(kind, id) {
  SEL = kind ? { kind, id } : null;
  MULTI.clear();
  paintSel();
  renderDetails();
}
let toastT;
function toast(msg) {
  let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
}

/* =========================================================
   Pointer interactions: drag bars, markers, pills, links
   ========================================================= */
const board = $("board");
let D = null;
function dateAt(e) {
  if (VIEW === "timeline") {
    const head = $("dayhead"); if (!head || !GEO) return null;
    const x = e.clientX - head.getBoundingClientRect().left;
    let i = 0; while (i < GEO.xs.length - 1 && x >= GEO.xs[i + 1]) i++;
    return GEO.days[i];
  }
  for (const el of document.elementsFromPoint(e.clientX, e.clientY)) if (el.dataset && el.dataset.date) return el.dataset.date;
  return null;
}
function rowAt(e) {             // insertion index among the rows on screen, timeline only
  const n = visTasks().length, body = $("tlBody"); if (!body) return n;
  const y = e.clientY - body.getBoundingClientRect().top - LANEH;
  return Math.max(0, Math.min(n, Math.round(y / ROWH)));
}
/* Puts a new row where it was dropped on screen: before the row at that place, inside the same embedded schedule as it.
   Dropped under an open block's own rows, it joins them. */
function placeNew(t, vri) {
  const V = visTasks();
  if (vri < V.length) { const at = V[vri].t; t.parent = at.parent || null; S.tasks.splice(S.tasks.indexOf(at), 0, t); return; }
  const last = V[V.length - 1];
  t.parent = last && last.depth ? last.t.parent : null;
  S.tasks.push(t);
}
function bodyPt(e) { const r = $("tlBody").getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function barUnder(e) { for (const el of document.elementsFromPoint(e.clientX, e.clientY)) { const b = el.closest && el.closest(".bar"); if (b) return b; } return null; }
function overBoard(e) { const r = board.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; }

board.addEventListener("pointerdown", e => {
  if (VIEW_ONLY) { if (e.type === "contextmenu") e.preventDefault(); return; }
  if (e.button !== 0 || e.target.closest(".inl,.dbadge,[data-sub],[data-colpick],[data-skipday]")) return;
  const knob = e.target.closest("[data-knob]"), lh = e.target.closest("[data-lh]");
  if (knob || lh) {
    e.preventDefault(); e.stopPropagation();
    const target = lh ? taskById(lh.dataset.lh) : null;
    const src = lh ? taskById(target.after) : taskById(knob.dataset.knob);
    D = { kind: "link", src: src.id, target: target ? target.id : null, x0: e.clientX, y0: e.clientY, moved: false };
    document.body.classList.add("linking");
    const b = $("tlBody"), svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "rubber"); svg.setAttribute("width", b.scrollWidth); svg.setAttribute("height", b.scrollHeight);
    svg.innerHTML = `<path/><circle r="4"/>`; b.appendChild(svg); D.svg = svg;
    const i = visTasks().findIndex(x => x.t === src), v = R.get(src.id);
    D.from = { x: xEnd(v.end) + labw(), y: LANEH + ROWH * i + ROWH / 2 };
    if (target) { const g = board.querySelector(`[data-link="${target.id}"]`); if (g) g.style.opacity = ".25"; }
    drawRubber(e);
    return;
  }
  const bar = e.target.closest(".bar,.cbar"), mk = e.target.closest(".mk,.chip");
  if (!bar && !mk) return;
  const anchor = dateAt(e); if (!anchor) return;
  e.preventDefault();
  if (bar) {
    const t = taskById(bar.dataset.tid), h = e.target.closest(".h");
    D = { kind: "task", id: t.id, edge: h ? h.dataset.edge : "move", anchor, x0: e.clientX, y0: e.clientY, orig: { ...R.get(t.id) }, snap: JSON.stringify(S), moved: false, onLabel: !!e.target.closest(".lbl"), shift: e.shiftKey };
    const grp = pickedTasks();
    if (!e.shiftKey && grp.length > 1 && grp.some(x => x.id === t.id)) { D.group = grp.map(x => x.id); D.origs = Object.fromEntries(grp.map(x => [x.id, { ...R.get(x.id) }])); }
  } else {
    const rid = mk.dataset.rid, did = mk.dataset.did;
    const item = rid ? S.reviews.find(r => r.id === rid) : S.deliveries.find(r => r.id === did);
    D = { kind: rid ? "review" : "delivery", id: rid || did, anchor, x0: e.clientX, y0: e.clientY, orig: item.date, snap: JSON.stringify(S), moved: false };
  }
  document.body.style.cursor = D.edge && D.edge !== "move" ? "ew-resize" : "grabbing";
});
function drawRubber(e) {
  const p = bodyPt(e), f = D.from;
  D.svg.querySelector("path").setAttribute("d", `M${f.x} ${f.y} C${f.x + 40} ${f.y} ${p.x - 40} ${p.y} ${p.x} ${p.y}`);
  const c = D.svg.querySelector("circle"); c.setAttribute("cx", p.x); c.setAttribute("cy", p.y);
  board.querySelectorAll(".bar.target").forEach(b => b.classList.remove("target"));
  const b = barUnder(e); if (b && b.dataset.tid !== D.src && !wouldCycle(b.dataset.tid, D.src)) b.classList.add("target");
}
document.addEventListener("pointerdown", e => {   // palette pills
  if (e.button !== 0) return;
  const p = e.target.closest("[data-pill],[data-rpill],[data-out],[data-lib],[data-pre]");
  if (!p || !$("pal").contains(p) || e.target.closest("[data-custdel]")) return;
  e.preventDefault();
  D = { kind: "pal", el: p, x0: e.clientX, y0: e.clientY, moved: false };
});
window.addEventListener("pointermove", e => {
  if (!D) return;
  if (!D.moved && Math.hypot(e.clientX - D.x0, e.clientY - D.y0) < 4) return;
  D.moved = true;
  if (D.kind === "link") { drawRubber(e); return; }
  if (D.kind === "pal") { palMove(e); return; }
  const d = dateAt(e); if (!d) return;
  if (D.kind === "task" && D.group) {   // several selected blocks: the same move or the same change of length for each
    const delta = wdSteps(D.anchor, d);
    S = JSON.parse(D.snap); STORE.list[S.id] = S; R = resolve();   // from where they all started, so linked blocks aren't pushed twice
    const order = D.group.map(id => taskById(id)).filter(Boolean).sort((a, b) => D.origs[a.id].start < D.origs[b.id].start ? -1 : 1);
    order.forEach(t => {
      const o = D.origs[t.id];
      if (D.edge === "move") setStart(t, addWD(o.start, delta));
      else if (D.edge === "end") { let ne = addWD(o.end, delta); if (ne < o.start) ne = o.start; setEnd(t, ne); }
      else { let ns = addWD(o.start, delta); if (ns > o.end) ns = o.end; setStart(t, ns); R = resolve(); setEnd(t, o.end); }
      R = resolve();
    });
  } else if (D.kind === "task") {
    const t = taskById(D.id); if (!t) return;
    const delta = wdSteps(D.anchor, d);
    if (D.edge === "move") {
      setStart(t, addWD(D.orig.start, delta));
      if (VIEW === "timeline") {   // drag up/down to reorder rows
        const body = $("tlBody"), y = e.clientY - body.getBoundingClientRect().top - LANEH;
        const V = visTasks(), ri = Math.max(0, Math.min(V.length - 1, Math.floor(y / ROWH))), over = V[ri] && V[ri].t;
        // rows only swap places with rows in the same schedule (a block's own rows stay inside it)
        if (over && over !== t && (over.parent || null) === (t.parent || null)) { const cur = S.tasks.indexOf(t), to = S.tasks.indexOf(over); S.tasks.splice(cur, 1); S.tasks.splice(to, 0, t); }
      }
    } else if (D.edge === "end") { let ne = addWD(D.orig.end, delta); if (ne < D.orig.start) ne = D.orig.start; setEnd(t, ne); }
    else { let ns = addWD(D.orig.start, delta); if (ns > D.orig.end) ns = D.orig.end; setStart(t, ns); R = resolve(); setEnd(t, D.orig.end); }
  } else {
    const item = D.kind === "review" ? S.reviews.find(r => r.id === D.id) : S.deliveries.find(r => r.id === D.id);
    if (item) {
      let nd = addDays(D.orig, diffDays(D.anchor, d));
      if (D.kind === "delivery") { const other = S.deliveries.find(x => x !== item && x.date === nd); if (other) nd = item.date; }
      item.date = nd;
    }
  }
  R = resolve(); renderBoard();
});
let SUPPRESS = 0;
window.addEventListener("pointerup", e => {
  if (!D) return;
  const d = D; D = null; SUPPRESS = Date.now(); document.body.style.cursor = ""; document.body.classList.remove("linking");
  if (d.kind === "link") return finishLink(d, e);
  if (d.kind === "pal") return finishPal(d, e);
  if (d.moved) { if (d.snap !== JSON.stringify(S)) { UNDO.push(d.snap); REDO = []; save(); } SEL = { kind: d.kind, id: d.id }; if (!d.group) MULTI.clear(); render(); }
  else if (d.kind === "task" && d.shift) shiftPick(d.id);
  else if (d.kind === "review") { select("review", d.id); wipTypeMenu(d.id, e.clientX, e.clientY); }   // click a WIP: switch it to another kind
  else select(d.kind, d.id);
});
function finishLink(d, e) {
  d.svg.remove();
  const b = d.moved ? barUnder(e) : null;
  const src = taskById(d.src), tgt = b ? taskById(b.dataset.tid) : null;
  if (!d.moved) { renderBoard(); if (d.target) select("task", d.target); return; }
  if (tgt && tgt.id !== src.id && !wouldCycle(tgt.id, src.id)) {
    if (d.target === tgt.id) return renderBoard();
    change(() => { if (d.target) unlink(taskById(d.target)); R = resolve(); link(src, tgt); });
    toast(`${tgt.name} now follows ${src.name}.`);
  } else if (d.target) {
    const t = taskById(d.target);
    change(() => unlink(t));
    toast(`Unlinked ${t.name}. It keeps its dates.`);
  } else renderBoard();
}

/* palette drag */
function palInfo(el) {
  const pre = el.dataset.pre;
  if (pre === "crew") { const n = el.dataset.name; return { type: "task", name: n, color: presetColor(n), days: 5 }; }
  if (pre === "custom") return { type: "task", name: "New block", color: 7, days: 5, nameIt: true };

const HOLIDAY_COUNTRIES = [["NZ", "New Zealand"], ["AU", "Australia"], ["GB", "United Kingdom"], ["IE", "Ireland"], ["US", "United States"], ["CA", "Canada"], ["CH", "Switzerland"], ["DE", "Germany"], ["AT", "Austria"], ["FR", "France"], ["NL", "Netherlands"], ["SE", "Sweden"], ["DK", "Denmark"], ["NO", "Norway"], ["ES", "Spain"], ["IT", "Italy"], ["SG", "Singapore"], ["ZA", "South Africa"]];

function defaultCountry() { return "NZ"; }
const HOL_CACHE = {}, HOL_BUSY = {};

  const k = cc + year; if (HOL_CACHE[k]) return HOL_CACHE[k];
  try { const v = JSON.parse(localStorage.getItem(KEY + ":hol:" + k)); if (Array.isArray(v)) return (HOL_CACHE[k] = v); } catch (e) {}
  if (HOL_BUSY[k]) return HOL_BUSY[k];
  return (HOL_BUSY[k] = fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/${cc}`).then(r => r.ok ? r.json() : []).then(list => {
    const v = (Array.isArray(list) ? list : []).filter(h => h.global !== false && validDate(h.date)).map(h => ({ date: h.date, name: h.name || h.localName || "Holiday" }));
    HOL_CACHE[k] = v; try { localStorage.setItem(KEY + ":hol:" + k, JSON.stringify(v)); } catch (e) {}

}

  const run = ++holRun, sid = S.id, cc = S.country, days = dayRange(), y0 = +days[0].slice(0, 4), y1 = +days[days.length - 1].slice(0, 4);
  let found = [];
  for (let y = y0; y <= y1; y++) found = found.concat(await holidaysFor(cc, y));

}

const RULES = `You edit a production schedule for an animation, VFX and live-action studio. You get the current schedule and the producer's request. Reply with ONLY a JSON object:
{"reply":"one or two short plain sentences to the producer saying what you changed, or a question if the request is unclear","ops":[ ...operations... ]}

Operations. Use exact ids from the schedule. Dates are YYYY-MM-DD.

  "after" links it: it starts the working day after that task ends, plus "lag" working days (a negative lag overlaps). Instead of "after" you can give "start":"<date>". Add "fixed":true to pin it so it never moves. Optional "index" sets the row (0 = top). "ref" lets later ops in this list use it as an id. "color" is 0-9 from the colour theme; reuse a pill's colour when the task matches a pill.
- {"op":"update_task","id":"<id>", plus any of "name","color","days","people","notes","start","end","lag","fixed":true}

- {"op":"link","from":"<task id>","to":"<task id>"}: "to" now follows "from" and gets pushed when "from" moves or grows. {"op":"unlink","id":"<task id>"} frees a task, keeping its dates.
- {"op":"delete_task","id":"<id>"}   {"op":"move_task","id":"<id>","index":0}
- {"op":"add_review","date":"<date>","type":"Client WIP","note":""}. Use one of the REVIEW TYPES. "WIP" alone means Internal WIP unless the request says client or agency.
- {"op":"update_review","id":"<id>", plus any of "date","type","note"}   {"op":"delete_review","id":"<id>"}
- {"op":"set_output_date","id":"<output id>","date":"<date>"}: moves one output to deliver that day. {"op":"add_output","name":"15s cutdown","count":2,"date":"<date>"}  {"op":"delete_output","id":"<id>"}
- {"op":"move_delivery","id":"<delivery id>","date":"<date>"}: moves a delivery day with all its outputs.
- {"op":"set_holiday","date":"<date>","name":"...","on":true}. A holiday is a day nobody works. Use on:false to remove one.
- {"op":"set_workday","date":"<date>","on":true}. This makes a skipped weekend day a working day. Use on:false to undo it.
- {"op":"set_project", plus any of "name","client","agency","start","weeks","days","skipWeekends"}. "days" is extra working days on top of the weeks.
- {"op":"build","name":"...","client":"...","agency":"...","start":"<date>","weeks":6,"days":0,"types":["3d"],"chars":"none|simple|complex","envs":"none|simple|large","style2d":"cel|mograph|cutout","format":"ad|short|feature|series|other","characters":3,"shootDate":"<date>","shootDays":2,"aiGuides":false,"aiPart":"bg|chars|all","stages":["<stage key>",...],"people":{"<role>":2},"lengths":{"<role>":[3,"full"]},"outputs":[{"name":"30s film","count":1,"date":"<date or empty for the last day>"}],"clientWipDays":[5],"agencyWipDays":[],"internalWipDays":[2],"skipWeekends":true}

function applyOps(ops) {
  const counts = new Map(), skipped = [], refs = {};

  const T = x => { if (x == null) return null; const k = refs[x] || String(x); return taskById(k) || S.tasks.find(t => t.name.toLowerCase() === k.toLowerCase()) || null; };
  const need = d => { if (!validDate(d)) throw new Error(`"${d}" isn't a date`); return d; };
  const col = c => { const n = parseInt(c, 10); return n >= 0 && n <= 9 ? n : null; };
  const rtype = name => S.reviewPills.find(p => p.name.toLowerCase() === String(name || "").toLowerCase()) || S.reviewPills.find(p => p.name === "Internal WIP") || S.reviewPills[0];
  for (const op of Array.isArray(ops) ? ops : []) {
    try {
      R = resolve();
      switch (op && op.op) {
        case "add_task": {
          const pill = S.pills.find(p => p.name.toLowerCase() === String(op.name || "").toLowerCase());
          const t = { id: uid("t"), name: String(op.name || "New task"), color: col(op.color) ?? (pill ? pill.color : 9), people: Math.max(0, op.people == null ? 1 : +op.people || 0), days: Math.max(1, parseInt(op.days, 10) || (pill ? pill.days : 5)), notes: op.notes ? String(op.notes) : "", mode: "start", after: null, lag: 0, date: null };
          if (op.after) { const p = T(op.after); if (!p) throw new Error(`no task "${op.after}"`); t.mode = "after"; t.after = p.id; t.lag = parseInt(op.lag, 10) || 0; }

          if (col(op.color) != null) t.color = col(op.color);
          if (op.people != null) t.people = Math.max(0, +op.people || 0);
          if (op.notes != null) t.notes = String(op.notes);
          if (op.lag != null) t.lag = parseInt(op.lag, 10) || 0;
          if (op.fixed === true) { t.mode = "date"; t.date = R.get(t.id).start; t.after = null; }
          if (op.days != null) t.days = Math.max(1, parseInt(op.days, 10) || 1);

          if (op.end) { R = resolve(); setEnd(t, need(op.end)); }
          note(`Changed ${t.name}`); break;
        }
        case "link": { const a = T(op.from), b = T(op.to); if (!a || !b) throw new Error("unknown task"); if (b.mode === "after") unlink(b); R = resolve(); if (!link(a, b)) throw new Error(`can't link ${b.name} after ${a.name}`); note(`Linked ${b.name} after ${a.name}`); break; }
        case "unlink": { const t = T(op.id); if (!t) throw new Error(`no task "${op.id}"`); unlink(t); note(`Unlinked ${t.name}`); break; }
        case "delete_task": { const t = T(op.id); if (!t) throw new Error(`no task "${op.id}"`); removeTask(t); note(`Deleted ${t.name}`); break; }
        case "move_task": { const t = T(op.id); if (!t) throw new Error(`no task "${op.id}"`); S.tasks.splice(S.tasks.indexOf(t), 1); S.tasks.splice(Math.max(0, Math.min(S.tasks.length, op.index | 0)), 0, t); note(`Moved ${t.name}`); break; }
        case "add_review": { const p = rtype(op.type); S.reviews.push({ id: uid("r"), date: need(op.date), type: p ? p.name : String(op.type || "Internal WIP"), color: p ? p.color : 6, note: op.note ? String(op.note) : "" }); note(`Added ${p ? p.name : op.type}`); break; }

    let remote = null; try { remote = await (await driveReq("https://www.googleapis.com/drive/v3/files/" + f.id + "?alt=media")).json(); } catch (e) { continue; }
    if (!remote || !remote.id) continue;
    REMOTE_AT[remote.id] = remote.updatedAt || 0;
    const local = STORE.list[remote.id];
    if (!local || (remote.updatedAt || 0) > (local.updatedAt || 0)) { remote.driveId = f.id; migrate(remote); STORE.list[remote.id] = remote; const { updatedAt, driveId, ...body } = remote; LAST[remote.id] = JSON.stringify(body); }
    else local.driveId = f.id;
  }
  // the example only stays when it's the only thing there
  const real = Object.values(STORE.list).filter(x => !x.example);
  if (real.length) Object.values(STORE.list).filter(x => x.example).forEach(x => delete STORE.list[x.id]);
  for (const x of Object.values(STORE.list)) if (!x.example && (!x.driveId || (x.updatedAt || 0) > (REMOTE_AT[x.id] || 0))) await pushOne(x);
  S = STORE.list[STORE.current] || Object.values(STORE.list)[0] || exampleSchedule();
  try { localStorage.setItem(KEY, JSON.stringify(STORE)); } catch (e) {}
  render(); renderChat();
  setDrive("connected", files.length ? files.length + " schedule" + (files.length === 1 ? "" : "s") : "");
}
let driveTimer = 0;
function queueDrive(id) { DIRTY.add(id); clearTimeout(driveTimer); driveTimer = setTimeout(flushDrive, 1500); }
async function flushDrive() {
  if (!accessToken) return; // sent on the next Connect
  setDrive("saving");
  try {
    for (const id of [...DIRTY]) { const x = STORE.list[id]; DIRTY.delete(id); if (x && !x.example) await pushOne(x); }
    try { localStorage.setItem(KEY, JSON.stringify(STORE)); } catch (e) {}
    setDrive("connected", new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
  } catch (e) { if (driveState !== "expired") setDrive("error", String(e.message || e)); }
}
async function trashOnDrive(x) {
  if (!x || !x.driveId || !accessToken) return;
  try { await driveReq("https://www.googleapis.com/drive/v3/files/" + x.driveId, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trashed: true }) }); }
  catch (e) { toast("Couldn't move it to the Drive bin: " + (e.message || e)); }
}
window.addEventListener("beforeunload", e => { if (DIRTY.size && accessToken) { flushDrive(); e.preventDefault(); e.returnValue = ""; } });

/* Print / PDF: the same page as on screen — title block, deliverables, then the schedule fitted to the width of A4 landscape
   (open embedded schedules print open). Save as PDF in the print window. */
/* Print / PDF (Christian 2026-11-13: "it does a pretty bad job … landscape … it just needs to look better"). A4 landscape, always.
   Timeline: page 1 is the title block, the deliverables and as many rows as fit; further pages repeat the weeks header and carry
   on with the rows; every page has a footer (project / client · page n of m). Each page is a fixed A4 sheet and anything that
   would spill over is scaled down to fit it, so a page never breaks in the middle. Calendar view prints the calendar instead,
   whole weeks only. */
const PRINT_W = 1047, PRINT_H = 714;   // A4 landscape less 10 mm margins, in CSS pixels
// caps: {cap1, capN} = rows on page 1 / on each later page, measured from a first layout (see the Print button); {all:true} = one page
function printHTML(caps = {}) {
  const keep = SEL, keepW = DAYW, keepG = GEO, keepL = LANEH, keepM = MULTI; SEL = null; MULTI = new Set(); let body;
  try {
    R = resolve();
    const head = `<div class="projhead">${headHTML(true)}</div><div class="deliv">${delivHTML(true)}</div>`;
    const foot = (i, n) => `<div class="pfoot"><span>${esc(S.name)}${S.client ? " / " + esc(S.client) : ""}</span><span>${n > 1 ? `Page ${i + 1} of ${n}` : esc(fmt(projStart()) + " to " + fmt(projEnd()))}</span></div>`;
    if (VIEW === "calendar") {
      body = `<div class="doc print calprint"${caps.calZoom && caps.calZoom < 1 ? ` style="zoom:${caps.calZoom}"` : ""}>${head}<div class="board">${calendarHTML()}</div>${foot(0, 1)}</div>`;
    } else {
      DAYW = Math.max(4, (PRINT_W - 24) / dayRange().length);
      timelineHTML(true, { to: 0 });   // works out the deliverables / WIP band's height (LANEH)
      const nOut = S.outputs.length, dRows = nOut <= 3 ? Math.max(1, nOut) : nOut <= 6 ? 3 : Math.ceil(nOut / 2);
      const headH = 150 + dRows * 30 + 40, weeksH = 90, footH = 30;
      const total = visTasks().length;
      let cap1 = caps.cap1 || Math.max(3, Math.floor((PRINT_H - headH - weeksH - LANEH - footH) / ROWH)), capN = caps.capN || Math.max(6, Math.floor((PRINT_H - weeksH - footH - 40) / ROWH));
      if (caps.all || total <= Math.floor(cap1 * 1.2)) cap1 = total;   // nearly fits: one page, shrunk a little, beats a second page with two rows
      const parts = [{ from: 0, to: Math.min(total, cap1) }];
      for (let from = parts[0].to; from < total; from += capN) parts.push({ from, to: Math.min(total, from + capN), lane: false });
      const sc = i => { const k = caps.scales && caps.scales[i]; return k && k < 1 ? ` style="width:${PRINT_W / k}px;min-height:${PRINT_H / k}px;transform:scale(${k})"` : ""; };
      // a page shrunk to fit is laid out wider before shrinking, so its days are widened to fill it edge to edge
      const nDays = dayRange().length, dayWFor = i => { const k = caps.scales && caps.scales[i]; return Math.max(4, (PRINT_W / (k && k < 1 ? k : 1) - 24) / nDays); };
      body = `<div class="doc print">${parts.map((p, i) => { DAYW = dayWFor(i); return `<section class="sheet"><div class="sheet-in"${sc(i)}>${i === 0 ? head : `<div class="contd">${esc(S.name)} <span>continued</span></div>`}<div class="board">${timelineHTML(true, p)}</div>${foot(i, parts.length)}</div></section>`; }).join("")}</div>`;
    }
  } finally { SEL = keep; DAYW = keepW; GEO = keepG; LANEH = keepL; MULTI = keepM; }
  const css = [...document.querySelectorAll("style")].map(x => x.textContent).join("\n");
  const vars = document.documentElement.getAttribute("style") || "";
  const fonts = document.querySelector('link[rel="stylesheet"]');
  return '<!doctype html><html lang="en" style="' + esc(vars) + '"><head><meta charset="utf-8"><title>' + esc(S.name) + '</title>' + (fonts ? fonts.outerHTML : "") + '<style>' + css + `
@page{size:A4 landscape;margin:10mm}
html,body{height:auto;margin:0;background:var(--surface)}
body{display:block;overflow:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc.print{display:block;overflow:visible;padding:0;width:${PRINT_W}px}
.sheet{width:${PRINT_W}px;height:${PRINT_H}px;overflow:hidden;break-after:page;page-break-after:always}
.sheet:last-child{break-after:auto;page-break-after:auto}
.sheet-in{width:${PRINT_W}px;min-height:${PRINT_H}px;display:flex;flex-direction:column;gap:12px;transform-origin:0 0}
.print .projhead{gap:20px}
.print .ttl .pname{font-size:44px}
.print .ttl .pclient{font-size:18px;margin-top:4px}
.print .fact .fv{font-size:16px}
.print .deliv{padding:14px 18px 12px}
.print .board{overflow:visible;flex:none}
.print .tl{width:auto!important}
.contd{font-weight:900;font-size:20px;text-transform:uppercase;letter-spacing:-.01em}
.contd span{font-weight:300;font-size:13px;letter-spacing:.24em;margin-left:10px;color:var(--ink-2)}
.pfoot{margin-top:auto;display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);padding-top:6px;border-top:1px solid var(--line-2)}
.calprint{display:flex!important;flex-direction:column;gap:12px}
.calprint .cal{min-width:0}
.calprint .wkt{break-after:avoid;page-break-after:avoid}
.calprint .wk{break-inside:avoid;page-break-inside:avoid}
.calprint .pfoot{margin-top:8px}
.bar,.mk,.cbar,.cev{cursor:default}
.bar .h,.knob,.subico,.cpick,svg.links circle.lh,.cbar .h,.lanetag{display:none}
.lane{cursor:default}
/* on screen (the preview only): grey desk, each A4 page white with its margins and a shadow */
@media screen{
  body{background:#8d8a83;padding:24px 0}
  .doc.print{width:auto}
  .sheet{box-sizing:content-box;padding:38px;margin:0 auto 24px;background:var(--surface);box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .calprint{box-sizing:content-box;width:${PRINT_W}px;padding:38px;margin:0 auto;background:var(--surface)}
}
</style></head><body>` + body + '</body></html>';
}
/* Measure, then bake the sizes in: the final page prints the same with no script running — in a browser's print window, and in
   Kontroll, which makes the PDF itself (vector) with scripts off. Laid out off-screen at the page's width:
   1. everything on one sheet: if it fits at 70% or more, that's the page;
   2. otherwise as many rows on page 1 as the title, deliverables, weeks and band leave room for, the rest on following pages;
   3. each page measured once more and shrunk just enough to fit its sheet. */
async function buildPrint() {
  const f = document.createElement("iframe");
  f.style.cssText = `position:fixed;left:-20000px;top:0;width:${PRINT_W}px;height:${PRINT_H}px;border:0`;
  document.body.appendChild(f);
  const load = html => new Promise(res => { f.onload = async () => { const d = f.contentDocument; try { await d.fonts.ready; } catch (e) {} res(d); }; f.srcdoc = html; });
  const fit = s => Math.min(1, PRINT_H / s.scrollHeight, PRINT_W / s.scrollWidth);
  try {
    if (VIEW === "calendar") {
      const d = await load(printHTML({})), cal = d.querySelector(".calprint");
      return printHTML({ calZoom: cal && cal.scrollWidth > PRINT_W ? PRINT_W / cal.scrollWidth : 1 });
    }
    let d = await load(printHTML({ all: true }));
    const one = d.querySelector(".sheet-in");
    if (one && fit(one) >= .7) return printHTML({ all: true, scales: [fit(one)] });
    const top = el => el ? el.getBoundingClientRect().top : 0, row = d.querySelector(".trow"), foot = d.querySelector(".pfoot");
    const firstRow = row ? top(row) - top(one) : 300, footH = foot ? foot.getBoundingClientRect().height + 14 : 30;
    const weeks = d.querySelector(".tl-head"), weeksH = weeks ? weeks.getBoundingClientRect().height : 90;
    const caps = { cap1: Math.max(3, Math.floor((PRINT_H - firstRow - footH) / ROWH)), capN: Math.max(6, Math.floor((PRINT_H - 40 - weeksH - footH - 12) / ROWH)) };
    d = await load(printHTML(caps));
    caps.scales = [...d.querySelectorAll(".sheet-in")].map(fit);
    return printHTML(caps);
  } finally { f.remove(); }
}
/* Print / PDF opens a preview of exactly what will print; its button sends it to the printer (Save as PDF there) — in Kontroll,
   straight to a PDF in Downloads. */
function printNow(html) {
  const f = document.createElement("iframe");
  f.style.cssText = `position:fixed;left:-20000px;top:0;width:${PRINT_W}px;height:${PRINT_H}px;border:0`;
  f.onload = () => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { toast("Printing isn't available here."); } setTimeout(() => f.remove(), 60000); };
  f.srcdoc = html; document.body.appendChild(f);
}
$("pdfBtn").onclick = async () => {
  if (!S) return;
  toast("Laying out the pages…");
  let html; try { html = await buildPrint(); } catch (e) { return toast("Couldn't lay out the pages."); }
  const pv = document.createElement("div"); pv.className = "pview";
  pv.innerHTML = `<div class="pv-bar"><b>Print preview</b><span id="pvInfo">A4 landscape</span><span class="grow"></span><button class="btn" id="pvClose">Close</button><button class="btn pri" id="pvGo">Print / Save PDF</button></div><iframe id="pvFrame" title="Print preview"></iframe>`;
  document.body.appendChild(pv);
  const fr = pv.querySelector("#pvFrame");
  fr.onload = () => {
    const d = fr.contentDocument, n = d.querySelectorAll(".sheet").length || 1;
    $("pvInfo").textContent = `A4 landscape · ${n} page${n === 1 ? "" : "s"}`;
    const z = Math.min(1, (fr.clientWidth - 40) / (PRINT_W + 76)); d.body.style.zoom = z;
  };
  fr.srcdoc = html;
  const close = () => { pv.remove(); document.removeEventListener("keydown", esc_); };
  const esc_ = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", esc_);
  $("pvClose").onclick = close;
  $("pvGo").onclick = () => { printNow(html); close(); };
};

/* boot */
(async () => {
  const shared = await readShareLink();
  if (shared) { VIEW_ONLY = true; S = shared; migrate(S); document.body.classList.add("viewonly"); $("voNote").hidden = false; document.title = S.name + " · Schedule"; }
  else load();
  render(); DAYW = fitDayW(); renderBoard(); renderChat(); initAI();
  if (!VIEW_ONLY && window.gsiLoaded) window.initGoogle();
})();
/* Share (Christian 2026-11-13): a link with the schedule packed into it (compressed, after the #, so it never reaches a server).
   It is a copy as of now: whoever opens it sees the page, the timeline and the calendar and can print, but can't change anything.
   After more changes, make a new link. */
async function packShare(obj) {
  const { driveId, updatedAt, example, ...body } = obj;
  const bytes = new TextEncoder().encode(JSON.stringify(body));
  const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  const buf = new Uint8Array(await new Response(cs).arrayBuffer());
  let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function readShareLink() {
  const m = location.hash.match(/^#view=([A-Za-z0-9_-]+)$/); if (!m) return null;
  try {
    const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/"), bin = atob(b64 + "===".slice((b64.length + 3) % 4));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    const v = JSON.parse(await new Response(ds).text());
    if (!v || !Array.isArray(v.tasks) || !validDate(v.start)) throw new Error("not a schedule");
    return v;
  } catch (e) { setTimeout(() => toast("This share link couldn't be read. Ask for a new one."), 300); return null; }
}
$("shareBtn").onclick = async () => {
  if (!S) return;
  let url;
  try { url = location.origin + location.pathname + "#view=" + await packShare(S); }
  catch (e) { return toast("Sharing isn't available in this browser."); }
  const box = $("dataDlg");
  $("dataT").textContent = "Share this schedule";
  box.querySelector("header p").textContent = "Send this link. It opens this schedule as it is now, read-only: the page, timeline and calendar, and they can print it. After more changes, make a new link.";
  $("dataTxt").value = url; $("dataTxt").rows = 4; $("dataMsg").textContent = "";
  $("dataImport").hidden = true; box.querySelector(".mfoot .grow").textContent = url.length > 8000 ? "A long link: it works in browsers, but some email apps cut long links, so a chat message is safer." : "";
  box.hidden = false;
  try { await navigator.clipboard.writeText(url); $("dataMsg").textContent = "Copied to the clipboard."; } catch (e) {}
};   // opens with the whole job in view, like the reference layouts
window.addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(renderBoard, 120); });
})();
